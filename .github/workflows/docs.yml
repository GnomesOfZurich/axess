name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'OPERATIONS.md'
      - 'SECURITY.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow only one concurrent deployment; cancel in-progress runs but
# don't cancel runs already mid-deploy (so a half-published Pages
# update doesn't get stuck).
concurrency:
  group: docs
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@v7

      # Pinned in the script, which the CI "Book" job also runs, so the book
      # a pull request was checked with is the book published here.
      - name: Install mdBook + mdbook-mermaid
        run: ./scripts/install-mdbook.sh

      - name: Install mermaid assets
        run: mdbook-mermaid install docs

      - name: Build book
        run: mdbook build docs

      # Compiles every fenced block the book does not mark `ignore`. Without
      # this the marking means nothing: the getting-started example sat at
      # `rust,no_run` for releases while calling an async method without
      # `.await` and importing `AuthnService` from the wrong module, because
      # nothing ever tried to build it.
      - name: Build the crates the book's examples import
        run: cargo build -p axess --all-features -p axess-example-minimal
      - name: Test book code
        run: mdbook test docs -L target/debug/deps

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
