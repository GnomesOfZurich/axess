name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write      # OIDC token for Sigstore keyless signing
  attestations: write  # GitHub artifact attestations

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify tag exists on main
        run: |
          tag="${{ inputs.tag }}"
          if ! git tag --list "$tag" | grep -q .; then
            echo "Tag $tag does not exist. Create it on main first: git tag $tag && git push --tags"
            exit 1
          fi
          tag_commit=$(git rev-list -n 1 "$tag")
          if ! git merge-base --is-ancestor "$tag_commit" main; then
            echo "Tag $tag points to a commit not on main. Releases must be from main."
            exit 1
          fi

  # Run the full CI suite before publishing.
  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches workspace version
        run: |
          tag="${{ inputs.tag }}"
          tag="${tag#v}"
          # `[workspace.package].version` is the single source of truth.
          # Every member inherits via `version.workspace = true`.
          version=$(awk '/^\[workspace\.package\]/{flag=1; next} /^\[/{flag=0} flag && /^version =/' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$tag" != "$version" ]; then
            echo "Tag v${tag} does not match [workspace.package].version ${version}"
            exit 1
          fi

      # bottom-up dependency order
      - name: Publish crates (resumable, rate-limit-aware)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish() {
            crate="$1"
            attempt=0
            while [ "$attempt" -lt 10 ]; do
              attempt=$((attempt + 1))
              if out=$(cargo publish -p "$crate" 2>&1); then
                echo "$out"; return 0
              fi
              echo "$out"
              if printf '%s' "$out" | grep -qiE "already uploaded|already exists"; then
                echo "::notice::$crate already published; skipping"; return 0
              fi
              if printf '%s' "$out" | grep -qi "429 Too Many Requests"; then
                after=$(printf '%s' "$out" | grep -oiE "try again after [^.]*GMT" | sed -E 's/.*after //I')
                target=$(date -u -d "$after" +%s 2>/dev/null || echo 0)
                now=$(date -u +%s)
                if [ "$target" -gt "$now" ]; then wait=$((target - now + 10)); else wait=120; fi
                echo "::notice::$crate rate-limited; sleeping ${wait}s"
                sleep "$wait"; continue
              fi
              echo "::error::publishing $crate failed"; return 1
            done
            echo "::error::publishing $crate exhausted retries"; return 1
          }
          for c in axess-strings axess-clock axess-rng axess-identity axess-events axess-cache axess-factors axess-core axess-macros axess; do
            publish "$c"
            sleep 30
          done

  # ── Signed release with SBOM ──────────────────────────────────────
  release:
    name: GitHub Release + SBOM
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx
          cargo cyclonedx --all --format json
          # Combine per-crate SBOMs into release artifacts
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './sbom/*' -exec mv {} sbom/ \;

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: sbom/*.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: sbom/*.cdx.json
