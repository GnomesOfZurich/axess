name: CI

# Work lands on release/next; main changes only by the release pull request
# from a release branch, and a patch line lives on release/X.Y.x (see
# docs/project/publishing.md). Every job below runs on a pull request into
# any of them. Into main, the "Release Version" job also requires the dated
# CHANGELOG.md section, and the main branch ruleset requires "Release Gate"
# and the named jobs to pass. The job `name:` values are those required
# check names: renaming one is a ruleset edit in the same release.
#
# release.yml calls this workflow on a release tag before it publishes.
on:
  push:
    branches: [main, release/next, 'release/*.x']
  pull_request:
    branches: [main, release/next, 'release/*.x']
  workflow_call:

# Nothing in this workflow writes to the repository. The Coverage job used
# to push a badge commit to main; release preparation commits the badge now.
permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # Format check
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ban `#[non_exhaustive]` from first-party Rust source. The
  # attribute trades one breakage class (adding variants) for another
  # (every downstream `match` needs a wildcard arm forever, even when
  # the caller wants compile-time exhaustiveness on a closed set).
  # Project policy is to bump the version and let downstream `match`
  # failures be loud. Enforce the rule here so a future contributor
  # cannot reintroduce the attribute without removing this gate.
  #
  # The name is quoted: unquoted, YAML reads ` #` as a comment and the check
  # was named "Ban".
  ban_non_exhaustive:
    name: "Ban #[non_exhaustive]"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject any non_exhaustive in first-party crates
        run: |
          set -eu
          # `--include` keeps the search to Rust sources; the explicit
          # crate roots avoid scanning `target/` or vendored deps.
          if grep -RIn --include='*.rs' \
              -e '#\[non_exhaustive\]' \
              -e '#\[ *non_exhaustive *\]' \
              axess axess-core axess-factors axess-macros examples; then
            echo "::error::#[non_exhaustive] is forbidden in first-party crates."
            echo "See CONTRIBUTING.md, 'No #[non_exhaustive] on first-party enums'."
            exit 1
          fi
          echo "OK: no #[non_exhaustive] occurrences."

  # (2026-05-16): block `cargo-mutants` mutation markers from
  # landing on `main`. A local `cargo mutants` run in-place (or one
  # that crashed mid-flight) leaves `/* ~ changed by cargo-mutants ~ */`
  # markers in the source tree; if the developer subsequently `git add`s
  # without inspecting the diff, the mutation lands as a stub body that
  # silently breaks the affected function. This guard runs on every push
  # and PR: catches the marker before review, regardless of whether
  # the developer's local pre-commit setup is configured to reject it.
  ban_cargo_mutants_markers:
    name: Ban cargo-mutants markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject committed cargo-mutants mutation markers
        run: |
          set -eu
          # First-party Rust source only. The marker can legitimately
          # appear in docs/comments (`docs/`, `ROADMAP.md`, `CHANGELOG.md`,
          # `axess-core/src/.../*.rs` `///` lines describing how the
          # mutator interacts with a given function): those are
          # documentation about cargo-mutants, not mutations. We grep
          # for the literal injection marker (`~ changed by cargo-mutants ~`)
          # inside .rs files; the marker only appears in the form
          # cargo-mutants injects it (lowercase, tilde-bracketed).
          if grep -RIn --include='*.rs' \
              -e '~ changed by cargo-mutants ~' \
              axess axess-core axess-factors axess-macros axess-cache axess-clock axess-rng axess-events axess-identity axess-strings axess-testing examples; then
            echo "::error::cargo-mutants mutation marker found in committed source."
            echo "A local cargo-mutants run left a stub body (e.g. \`() /* ~ changed by cargo-mutants ~ */\`)"
            echo "in the source. Revert the file to its real implementation before merging."
            echo "Run cargo-mutants through scripts/mutants.sh, which mutates a separate worktree."
            exit 1
          fi
          echo "OK: no cargo-mutants mutation markers in source."

  # lockfile-drift check. Cargo.lock is tracked (axess workspace
  # policy: see `.gitignore` comment). Without this gate, a `cargo build`
  # inside the test job silently refreshes the lockfile when a Cargo.toml
  # change isn't accompanied by a corresponding lockfile bump, and the
  # uncommitted Cargo.lock update lands on `main` invisibly. `--locked`
  # makes cargo fail fast when the lockfile needs regeneration; the
  # follow-up `git diff` catches the case where it didn't need
  # regeneration but a contributor's local `cargo` ran without `--locked`
  # and shipped a drifted lockfile in the same PR.
  lockfile_drift:
    name: Lockfile Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify Cargo.lock is up-to-date and unchanged
        run: |
          set -eu
          # 1. Build with --locked. If Cargo.toml moved without the
          #    corresponding lockfile bump, cargo refuses to proceed.
          cargo metadata --locked --format-version 1 > /dev/null
          # 2. Re-check that no step somehow mutated Cargo.lock anyway
          #    (would mean we're rebuilding against a different lockfile
          #    than the committed one: defence in depth).
          git diff --exit-code Cargo.lock

  # Detect orphan source files: any `.rs` under `src/` (other than the
  # crate entry points) must be reachable from its parent module file
  # via a `mod NAME;` declaration. The Phase A/B/C restructure left two
  # orphans behind that `cargo build` silently ignored (the compiler
  # only reads files it is told to read); this gate catches a repeat.
  #
  # Convention: modern Rust module layout (`foo.rs` + sibling `foo/`).
  # For `crate/src/A/B/X.rs` the parent file is `crate/src/A/B.rs`
  # (or `crate/src/lib.rs` at depth 1). Legacy `mod.rs` is honoured as
  # a fallback parent but is not used in this workspace.
  unreachable_sources:
    name: Detect orphan .rs files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify every src/*.rs is reachable from its crate root
        run: |
          set -eu
          errors=0
          crates="axess axess-core axess-factors axess-macros axess-cache axess-clock axess-rng axess-events axess-identity axess-strings axess-testing"
          for crate_root in $crates; do
            src="$crate_root/src"
            [ -d "$src" ] || continue
            while IFS= read -r f; do
              base=$(basename "$f" .rs)
              dir=$(dirname "$f")
              if [ "$dir" = "$src" ]; then
                parent="$src/lib.rs"
                [ -f "$parent" ] || parent="$src/main.rs"
              else
                parent="${dir}.rs"
                [ -f "$parent" ] || parent="$dir/mod.rs"
              fi
              if [ ! -f "$parent" ]; then
                echo "::error file=$f::No parent module file (looked for ${dir}.rs and $dir/mod.rs)"
                errors=$((errors+1))
                continue
              fi
              # `mod NAME;` with optional `pub` prefix and any whitespace.
              # Also accept `#[path = "..NAME.rs"]` indirection.
              if ! grep -qE "(^|[[:space:]])mod[[:space:]]+${base}[[:space:];{]" "$parent" \
                 && ! grep -qE "#\[path[[:space:]]*=[[:space:]]*\"[^\"]*${base}\.rs\"\]" "$parent"; then
                echo "::error file=$f::Orphan source: not reachable via 'mod ${base};' in $parent"
                errors=$((errors+1))
              fi
            done < <(find "$src" -name '*.rs' -type f ! -name lib.rs ! -name main.rs ! -name mod.rs)
          done
          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors orphan .rs file(s) found. Either declare them with 'mod NAME;' or delete."
            exit 1
          fi
          echo "OK: every src .rs file is reachable from its crate root."

  # Clippy lints
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  # `cargo doc` under `-D warnings` so broken intradoc links and other
  # rustdoc-level rot fail the build instead of degrading docs.rs
  # output silently. Run against the two crates that ship to docs.rs
  # under `all-features` (`axess` + `axess-core`); leaf crates compile
  # transitively under those.
  rustdoc:
    name: Rustdoc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Was `-p axess -p axess-core`: two crates of eighteen, which is how 29
      # unresolved intra-doc links accumulated elsewhere in the workspace. The
      # script covers every member and proves it rendered each one, since
      # `cargo doc` prints nothing and exits 0 when the docs are fresh.
      - name: Build rustdoc with warnings as errors
        run: ./scripts/check-doc-links.sh

      # Markdown links, which the rustdoc gate above cannot see. Resolved
      # offline: a github.com link into this repo is a repo path wearing a
      # URL, so no network flakiness can disable this one.
      - name: Markdown links resolve
        run: ./scripts/check-markdown-links.sh

      - name: Prose style
        run: ./scripts/check-prose-style.sh

      - name: Documented identifiers exist
        run: ./scripts/check-doc-identifiers.sh

      # `cargo doc` rejects a broken intra-doc link. It says nothing about a
      # plain backticked `Type::method`, nor about a ```text fence, which is
      # what a setup example becomes once it stops compiling. Both are how a
      # reader learns which call to make.
      - name: Documented methods exist
        run: ./scripts/check-rustdoc-identifiers.sh

      # The identifier checks confirm a name exists. This confirms the path
      # the docs tell an adopter to write: `axess::factors::mtls` named a
      # real type through a module that has never existed.
      - name: Documented imports resolve
        run: ./scripts/check-facade-paths.sh

      # Copy-pasteable `axess = { version = "..." }` snippets name the
      # workspace version; nothing else keeps them in step with a bump.
      - name: Documented versions
        run: ./scripts/check-doc-versions.sh

  # The source-layout rules from AGENTS.md that the release preflight
  # enforces: no inline test block over the limit, and production files and
  # functions under their size limits against the recorded baseline.
  source_rules:
    name: Source Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inline test block sizes
        run: ./scripts/check-inline-tests.sh
      - name: File and function sizes
        run: ./scripts/check-file-sizes.sh
      - name: Wall-clock reads outside axess-clock
        run: ./scripts/check-clock-usage.sh
      - name: rsa call sites
        run: ./scripts/check-rsa-sites.sh

  # The book, built and tested with the mdBook the docs workflow publishes
  # with (both install through scripts/install-mdbook.sh). The docs workflow
  # runs only after a merge to main, so without this job a book.toml the
  # pinned mdBook rejects, or a book example that no longer compiles, was
  # found after the release it shipped in.
  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install mdBook + mdbook-mermaid
        run: ./scripts/install-mdbook.sh
      - name: Install mermaid assets
        run: mdbook-mermaid install docs
      - name: Build book
        run: mdbook build docs
      - name: Build the crates the book's examples import
        run: cargo build -p axess --all-features -p axess-example-minimal
      - name: Test book code
        run: mdbook test docs -L target/debug/deps

  # Tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    services:
      # Every service image below is pinned by the digest of its multi-arch
      # index (read from the registry on 2026-11-08), with the tag kept for the
      # reader: the tag says what was meant, the digest is what runs. Moving a
      # pin is a deliberate edit that reads the new digest from the registry.
      # Valkey (Redis-compatible). Service name and redis-cli are standard;
      # Valkey maintains full wire-protocol compatibility with Redis.
      redis:
        image: valkey/valkey:latest@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:latest@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: axess_test
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Keycloak with the FAPI example's realm, for the private_key_jwt login
      # test (axess-core/tests/oauth_keycloak_live.rs). Started as a step, not
      # a service, because the realm file comes from the checkout. Loopback
      # only: the realm ships admin/admin and alice/alice.
      - name: Start Keycloak (realm fapi)
        run: |
          docker run -d --name axess-keycloak-test -p 127.0.0.1:8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_ENABLED=true -e KC_HOSTNAME_STRICT=false \
            -v "$PWD/examples/fapi/keycloak/fapi-realm.json:/opt/keycloak/data/import/fapi-realm.json:ro" \
            quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858 start-dev --import-realm

      # Every test not marked ignored: unit, integration and doc tests, the
      # release preflight's "Workspace tests" step. This used to be `--lib`
      # plus `--doc`, which left the non-ignored tests under each crate's
      # tests/ to the Coverage job alone.
      - name: Run workspace tests
        run: cargo test --workspace --all-features
        env:
          VALKEY_URL: redis://localhost:6379
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          MYSQL_URL: mysql://root:mysql@localhost:3306/axess_test

      # The workspace tests above give Keycloak its start-up time; this only
      # waits for whatever is left of it.
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/realms/fapi && exit 0
            sleep 2
          done
          docker logs axess-keycloak-test | tail -50
          exit 1

      # The script the release preflight runs: the ignored tests against the
      # live stores, refused when a URL is unset or when nothing passed.
      - name: Run integration tests (with Valkey + Postgres + MySQL + Keycloak)
        run: ./scripts/check-live-stores.sh
        env:
          KEYCLOAK_URL: http://127.0.0.1:8080
          VALKEY_URL: redis://localhost:6379
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          MYSQL_URL: mysql://root:mysql@localhost:3306/axess_test

  # CockroachDB wire-protocol compatibility. Cockroach speaks the Postgres
  # wire protocol, so the existing `postgres` backend (sqlx::PgPool) should
  # work unmodified. This job runs the postgres integration suite against
  # a Cockroach single-node instance to catch divergence early:
  # transaction-retry semantics, `ON CONFLICT DO UPDATE` quirks, and
  # `DATEADD`-equivalent edge cases that Cockroach handles slightly
  # differently from real Postgres.
  #
  # Caveats are documented in `docs/sessions/backends.md`. If a test fails here
  # but passes against Postgres, the divergence is either a Cockroach
  # bug (file upstream) or one we'll document and work around.
  cockroach_compat:
    name: CockroachDB Compatibility
    runs-on: ubuntu-latest
    services:
      cockroach:
        image: cockroachdb/cockroach:latest@sha256:9f9172a9c03771263bd8af89dbb76d490d5cd6d8c6029a23de5b3456f01cb9ff
        ports:
          - 26257:26257
          - 8080:8080
        # `start-single-node --insecure` is the standard CI shape: no
        # TLS, in-memory store ok for the duration of the job. The
        # health-cmd polls Cockroach's HTTP admin endpoint which is
        # available only after the node has fully started.
        options: >-
          --health-cmd "curl -fs http://localhost:8080/health?ready=1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
        env:
          COCKROACH_ARGS: "start-single-node --insecure"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Cockroach defaults to user `root` with no password on `--insecure`
      # mode. We point the existing postgres integration suite at port
      # 26257: same `POSTGRES_URL` env var consumed by the tests, just
      # against a different backend speaking the same wire protocol.
      - name: Run postgres integration tests against CockroachDB
        run: cargo test -p axess-core --features postgres,testing -- --ignored
        env:
          POSTGRES_URL: postgres://root@localhost:26257/defaultdb?sslmode=disable

  # MSRV check: verify the declared minimum supported Rust version still
  # builds and tests. Bump in lockstep with `rust-version` in each Cargo.toml.
  msrv:
    # The version is read from Cargo.toml rather than written here as well.
    # It was hardcoded twice (job name and toolchain) and went stale: the tree
    # declared 1.93.1 while sqlx 0.9.0 required 1.94.0, so the promise was
    # already false and nothing said so.
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        name: Read rust-version from Cargo.toml
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | grep -m1 '^rust-version' | sed 's/.*"\(.*\)".*/\1/')
          test -n "$version" || { echo "could not read rust-version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Same script maintainers run locally, so the two cannot drift.
      - name: Build and test on the declared MSRV
        run: ./scripts/check-msrv.sh

  # Build check for different platforms
  build:
    name: Build Check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build all targets
        run: cargo build --workspace --all-features --all-targets

  # Feature isolation matrix. The default `--all-features` build hides
  # gate regressions: a `pub use Foo` that should live behind
  # `cfg(feature = "memory")` (or `testing`) compiles fine under
  # `--all-features` and only breaks for adopters who opt out. This
  # matrix builds feature-minimal slices so a missing gate fails CI
  # instead of an adopter's prod build.
  feature_isolation:
    name: Feature Isolation (${{ matrix.profile }})
    runs-on: ubuntu-latest
    # A warning here is an item gated wider than its users: dead code in the
    # profiles between the two gates, which only this matrix compiles.
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        include:
          # No optional features. Catches accidentally-public types from
          # gated modules (`MemorySessionStore`, `MockIdentityStore`, …).
          - profile: no-default-features
            flags: --no-default-features
          # Defaults only. Catches a default feature accidentally pulling
          # in `memory` or `testing` transitively.
          - profile: default-features
            flags: ""
          # `memory` on, `testing` off. Catches a type that's supposed
          # to be `memory`-only leaking a `testing` dep.
          - profile: memory-only
            flags: --no-default-features --features memory
          # SQLite-only: catches a re-export from a sibling crate (e.g.
          # `axess-identity`) that fails to gate properly when the
          # caller enables a storage feature without also enabling
          # `testing`. Previously regressed once: see the
          # `pub use axess_identity::testing` fix in `axess-core/src/authn/ids.rs`.
          - profile: sqlite-only
            flags: --no-default-features --features sqlite
          # Postgres-only: same shape as sqlite-only, different backend.
          - profile: postgres-only
            flags: --no-default-features --features postgres
          # MySQL-only: confirms the MySQL session backend compiles with
          # nothing else turned on (no postgres, no sqlite, no
          # device-store). Catches `MysqlSessionStore` accidentally
          # pulling in a postgres-gated symbol.
          - profile: mysql-only
            flags: --no-default-features --features mysql
          # Valkey-only: same shape; also exercises the SessionRegistry
          # backend path which only Valkey carries.
          - profile: valkey-only
            flags: --no-default-features --features valkey
          # `delegated` without a store: session crypto compiles for the
          # encrypted credential store alone. Its unit tests once failed to
          # build here (the bound seal's subkey was gated on the stores).
          - profile: delegated-only
            flags: --no-default-features --features delegated,jwt-rust-crypto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `cargo check --lib` rather than `cargo build`: faster (skips
      # link), and matches what catches the missing-cfg-gate class of
      # bugs locally. `--lib` keeps the check scoped to library targets
      # only so the absence of a feature can't be masked by an
      # integration-test target pulling extra deps.
      - name: Check axess-core (${{ matrix.profile }})
        run: cargo check -p axess-core --lib ${{ matrix.flags }}
      - name: Check axess facade (${{ matrix.profile }})
        run: cargo check -p axess --lib ${{ matrix.flags }}
      # `#[cfg(test)]` widens gates, so the unit tests compile code the
      # library alone does not.
      - name: Check axess-core unit tests (${{ matrix.profile }})
        run: cargo check -p axess-core --lib --profile test ${{ matrix.flags }}

  # Each factor or protocol feature of axess-factors alone, so a dependency a
  # feature uses without naming (`totp` once needed `chrono` from `hotp`)
  # fails here instead of in an adopter's build. Mirrored by
  # scripts/check-feature-matrix.sh.
  factor_isolation:
    name: Factor Isolation (${{ matrix.features }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        features:
          - totp
          - hotp
          - password
          - email_otp
          - recovery_code
          - fido2
          - ldap
          - mtls
          - http-body
          - social
          - jwt,jwt-rust-crypto
          - oidc,jwt-rust-crypto
          - bearer,jwt-rust-crypto
          - oauth,jwt-rust-crypto
          - outbound-oauth,jwt-rust-crypto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check axess-factors (${{ matrix.features }} alone)
        run: cargo check -p axess-factors --lib --no-default-features --features ${{ matrix.features }}

  # Check that examples compile
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      
      - name: Build all examples
        run: |
          cargo build --package axess-example-sqlite
          cargo build --package axess-example-oauth
          cargo build --package axess-example-authz

  # coverage-guided fuzzing of decode hot-paths. Smoke run only
  # on PR/push: 30 s per target catches the easy crashes without
  # blocking CI on a deeper soak. Schedule a longer run in a separate
  # workflow if/when needed.
  fuzz:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz@0.13.2 --locked
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build
      - name: Run each target for 30 s
        working-directory: fuzz
        run: |
          set -eu
          for target in session_data_msgpack session_data_json jwt_payload_split pkce_verifier_predicate; do
            echo "::group::fuzz $target"
            cargo +nightly fuzz run "$target" -- -max_total_time=30
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/

  # Benchmarks: compile check + run to catch regressions.
  # Results are uploaded as artifacts for comparison across runs.
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run benchmarks
        run: cargo bench -p axess-core --all-features -- --output-format bencher | tee bench-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-output.txt

  # Verify each library crate can be packaged for crates.io. Catches
  # missing license/readme files, ungated path dependencies, and oversized
  # packages BEFORE a release tag forces the issue. Runs the leaf crates
  # (no internal deps) end-to-end via dry-run; the downstream crates would
  # need bottom-up registry publishes to pass dry-run, so they're verified
  # via `cargo package` (which produces the .crate file without uploading
  # and without resolving the path deps via the registry).
  publish_dryrun:
    name: Publish Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `cargo publish --dry-run` for leaf crates: a true end-to-end check
      # including the registry-resolution step. Catches the long tail of
      # crates.io packaging issues that `cargo package` alone misses.
      - name: Dry-run publish leaf crates (no internal deps)
        run: |
          set -eu
          for c in axess-strings axess-clock axess-rng axess-testing; do
            echo "::group::dry-run $c"
            cargo publish --dry-run -p "$c"
            echo "::endgroup::"
          done
      # `cargo package --list` for the rest. We cannot dry-run-publish
      # them on CI because dry-run resolves internal deps against the live
      # registry, and the dependency versions only exist after the actual
      # publish steps begin. `--list` still validates the package manifest
      # and lets us inspect the shipped file set; the registry-resolution
      # path is exercised for real by `release.yml`.
      - name: Package check for non-leaf crates
        run: |
          set -eu
          for c in axess-identity axess-events axess-cache axess-factors axess-core axess-macros axess; do
            echo "::group::package $c"
            cargo package --list -p "$c" >/dev/null
            echo "::endgroup::"
          done

  semver_checks:
    name: SemVer Checks
    runs-on: ubuntu-latest
    # SemVer only matters for release-relevant triggers: pull requests
    # (where a break would land on main), workflow_dispatch (the release
    # workflow reuses this job via `uses:`, and its caller event
    # propagates here), and version-tag pushes. Ordinary branch pushes
    # skip: they'll be revalidated at PR time and by
    # `scripts/release-preflight.sh` before tagging. Cuts the multi-
    # minute install-and-baseline-build off every non-release push.
    if: |
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      # The whole history and its tags: the baseline is the last release
      # tag below HEAD, built from git rather than fetched from crates.io.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # `cache-bin: "true"` (default in v2, pinned explicitly here) keeps
      # ~/.cargo/bin/cargo-semver-checks across runs, so the install step
      # below is a no-op on warm cache. The first run under `shared-key:
      # semver` pays a full cold-cache tax; every run after is fast.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: semver
          cache-bin: "true"
      # Guard on `command -v` so we skip the cargo-install registry check
      # entirely when the cached binary is already present. Saves ~15 s on
      # every warm run.
      - name: Install cargo-semver-checks
        run: |
          command -v cargo-semver-checks >/dev/null \
            || cargo install cargo-semver-checks@0.51.0 --locked
      # The script the release preflight runs. It refuses when no release
      # tag is below HEAD instead of skipping, as the registry baseline did.
      - name: SemVer checks against the last release tag
        run: ./scripts/check-semver.sh

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install audit tools
        run: cargo install cargo-audit@0.22.2 cargo-deny@0.20.2 cargo-cyclonedx@0.5.10 --locked
      # cargo-deny and cargo-audit read different ignore files; a drift
      # between them means one gate accepts an advisory the other fails.
      - name: Advisory ignore lists agree (deny.toml vs .cargo/audit.toml)
        run: |
          advisory_ids() { grep -oE '^[[:space:]]*"RUSTSEC-[0-9]{4}-[0-9]{4}"' "$1" | tr -d ' "' | sort -u; }
          diff <(advisory_ids deny.toml) <(advisory_ids .cargo/audit.toml)
      - name: Run security audit
        run: cargo audit --deny warnings
      # cargo-deny 0.20 reads the CVSS 4.0 entries in the RustSec database,
      # which 0.18 stopped on, so advisories run here beside cargo audit.
      - name: Run cargo-deny (advisories + bans + licenses + sources)
        run: cargo deny check advisories bans licenses sources
      - name: Test-only crates stay out of production graphs
        run: |
          cargo deny --config deny-production.toml check bans
          scripts/check-test-crate-edges.sh
      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --all --format json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: "**/*.cdx.json"
          retention-days: 90

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    services:
      # Valkey (Redis-compatible); see note in Integration Tests job above.
      redis:
        image: valkey/valkey:latest@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:latest@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      # Instrumented builds use a different profile than the clippy/test
      # cache, so scope this cache separately: sharing the default key
      # thrashed both caches.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
      - run: cargo install cargo-llvm-cov@0.9.1 --locked
      # Run the instrumented test suite ONCE, then render summary + HTML
      # from the same profile data. The old version invoked
      # `cargo llvm-cov` twice (`--summary-only`, then `--html`), each
      # rebuilding and re-running the full workspace under instrumentation,
      # an easy ~50% wall-clock cut here.
      - name: Run instrumented tests
        run: cargo llvm-cov --workspace --all-features --no-report
        env:
          VALKEY_URL: redis://localhost:6379
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Render coverage summary
        run: cargo llvm-cov report --summary-only 2>&1 | tee coverage-summary.txt
      - name: Render coverage HTML
        run: cargo llvm-cov report --html --output-dir coverage-html
      - name: Extract coverage percentage
        id: cov
        run: |
          pct=$(./scripts/coverage-badge.sh measured)
          echo "pct=${pct}" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${pct}%"
      - name: Print summary
        run: |
          {
            echo "## Coverage: ${{ steps.cov.outputs.pct }}%"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-html/
      # No badge commit from here: main changes only by a release pull
      # request, and its ruleset refuses a push from this job. Release
      # preparation measures and commits the badge (docs/project/publishing.md,
      # "Release preparation"), and the last step holds it to this run, after
      # the summary and the report are out so a refusal still shows them.
      - name: Crafted cases for the coverage badge check
        run: ./scripts/coverage-badge-tests.sh
      # Release preparation commits the badge with the release; a figure more
      # than one point from this run's is stale (the script says why one).
      - name: Committed coverage badge matches the measured figure
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PCT: ${{ steps.cov.outputs.pct }}
        run: ./scripts/coverage-badge.sh check "$PCT"

  # Drift check for the derived badges (version, license). Regenerates
  # both from [workspace.package] in Cargo.toml and fails if the
  # committed SVGs are out of date. Coverage is measured rather than
  # derived, so the Coverage job above checks it within a tolerance; this
  # job is separate because version/license changes are rare, deliberate
  # edits: drift is a signal to the contributor, not something CI should
  # silently fix.
  # Pure bash + sed + awk: no Rust toolchain needed.
  badges:
    name: Badges in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regenerate derived badges
        run: ./scripts/update-badges.sh
      - name: Fail if badge drift
        run: |
          if ! git diff --exit-code .github/badges/version.svg .github/badges/license.svg; then
            echo ""
            echo "Version/license badges are out of sync with Cargo.toml."
            echo "Locally run: ./scripts/update-badges.sh && git add .github/badges/ && git commit"
            exit 1
          fi

  # The version being released is the version written down: the workspace
  # version, the internal crate pins, the tag and the dated CHANGELOG.md
  # section (scripts/check-release-version.sh says what each refusal
  # prevents). Strict on a pull request into main, on main and on a release
  # tag; on release/next and release/X.Y.x before preparation the dated
  # section is not yet required, and [Unreleased] is what is checked.
  release_version:
    name: Release Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The main ruleset can require a pull request but not where it comes
      # from; this refuses one into main from anything but a release branch.
      - name: A pull request into main comes from a release branch
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -eu
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::refused: main changes only by a pull request from a branch of $GITHUB_REPOSITORY, and this one is from $HEAD_REPO."
            exit 1
          fi
          if ! [[ "$GITHUB_HEAD_REF" =~ ^release/(next|[0-9]+\.[0-9]+\.x)$ ]]; then
            echo "::error::refused: main changes only by a pull request from release/next or release/X.Y.x, and this one is from '$GITHUB_HEAD_REF'."
            exit 1
          fi
          echo "OK: pull request from $GITHUB_HEAD_REF."
      - name: Crafted cases for the version check
        run: ./scripts/check-release-version-tests.sh
      - name: Version, tag and dated changelog section agree
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*)
              ./scripts/check-release-version.sh --tag "$GITHUB_REF_NAME" ;;
            refs/heads/main)
              ./scripts/check-release-version.sh ;;
            *)
              if [ "${GITHUB_BASE_REF:-}" = main ]; then
                ./scripts/check-release-version.sh
              else
                ./scripts/check-release-version.sh --allow-unreleased
              fi ;;
          esac

  # One check that stands for every job above, matrix rows included, so the
  # main branch ruleset does not have to name each "Feature Isolation (...)"
  # row and a new row is required the moment it exists. scripts/check-ci-gate.sh
  # refuses a job that is missing from `needs`. On a pull request a skipped
  # need is a failure (nothing in this workflow skips on a pull request); on
  # a push the SemVer job skips by design.
  release_gate:
    name: Release Gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - fmt
      - ban_non_exhaustive
      - ban_cargo_mutants_markers
      - lockfile_drift
      - unreachable_sources
      - clippy
      - rustdoc
      - source_rules
      - book
      - test
      - cockroach_compat
      - msrv
      - build
      - feature_isolation
      - factor_isolation
      - examples
      - fuzz
      - bench
      - publish_dryrun
      - semver_checks
      - audit
      - coverage
      - badges
      - release_version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every job in ci.yml is a need of this one
        run: ./scripts/check-ci-gate.sh
      - name: Every need passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then allowed='success'; else allowed='success|skipped'; fi
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | sort > results.txt
          cat results.txt
          if grep -vE " (${allowed})\$" results.txt; then
            echo "::error::the jobs above did not pass; the release gate is closed."
            exit 1
          fi
          echo "OK: $(wc -l < results.txt | tr -d ' ') jobs passed."
