name: Mutants

# Mutation testing. On a pull request it mutates only the lines the PR
# touches (`--in-diff`) and fails on a survivor; on the weekly schedule it
# mutates the whole workspace, sharded so every shard finishes inside the
# job limit, and reports the kill rate per file.
#
# The sweep refuses to be blind. Until this layout every scheduled run
# since the workflow existed was cancelled at the 6 h job limit with no
# outcomes, and passed with a warning. Now the summary job fails the run
# when any shard is missing, cancelled, unfinished or short, or when the
# shards together tested a different number of mutants than the plan
# listed. `scripts/mutants-sweep.sh` holds the per-shard flags and the
# sizing arithmetic; `scripts/mutants-summary.py` holds the refusals and
# proves them with `--self-test` in the plan job.

on:
  # Pull requests into the working branches, where a change arrives one at a
  # time. A release pull request into main carries a whole round, already
  # swept change by change here and whole by the weekly schedule; sweeping it
  # again planned over a thousand mutants on the first release.
  pull_request:
    branches: [release/next, 'release/*.x']
  schedule:
    # Sunday 03:00 UTC.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      full_sweep:
        description: 'Run the full sweep across all files (vs PR-diff only)'
        required: false
        type: boolean
        default: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Bump in lockstep with the local dev environment.
  CARGO_MUTANTS_VERSION: 27.0.0

jobs:
  plan:
    name: Plan the sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      total: ${{ steps.plan.outputs.total }}
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `--in-diff` needs the merge base to diff against.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Prove the summary's refusals
        run: python3 scripts/mutants-summary.py --self-test

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version "$CARGO_MUTANTS_VERSION" --locked

      - name: Determine sweep scope
        id: scope
        run: |
          set -eu
          mkdir -p plan
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ inputs.full_sweep }}" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            : > plan/args
          else
            echo "mode=in-diff" >> "$GITHUB_OUTPUT"
            git fetch origin "${{ github.base_ref }}"
            git diff "origin/${{ github.base_ref }}"...HEAD > plan/pr.diff
            wc -l plan/pr.diff
            echo "--in-diff plan/pr.diff" > plan/args
          fi
          cp "$(command -v cargo-mutants)" plan/cargo-mutants

      - name: Size the matrix
        id: plan
        run: |
          set -eu
          # shellcheck disable=SC2046
          scripts/mutants-sweep.sh plan $(cat plan/args) > plan/sizing
          cat plan/sizing
          total=$(sed -n 's/^total=//p' plan/sizing)
          shards=$(sed -n 's/^shards=//p' plan/sizing)
          if [ "${{ steps.scope.outputs.mode }}" = "full" ] && [ "$total" -eq 0 ]; then
            echo "::error::the full sweep listed no mutants: the cargo-mutants config selects nothing."
            exit 1
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c "import json; print(json.dumps(list(range($shards))))")" >> "$GITHUB_OUTPUT"

      - name: Hand the plan to the shards
        uses: actions/upload-artifact@v7
        with:
          name: mutants-plan
          path: plan/
          retention-days: 7
          if-no-files-found: error

  baseline:
    # The full sweep runs the unmutated suite once, here, in place of a
    # baseline in each of its shards (`--baseline skip` there). Its cache is
    # the one the shards restore. A pull request's single shard runs its own
    # baseline over just the packages its diff touches.
    name: Unmutated baseline
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
      - name: Test the default members with every feature, as each mutant is tested
        run: cargo test --all-features

  shard:
    name: cargo-mutants shard ${{ matrix.shard }}
    needs: [plan, baseline]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.total != '0' &&
      (needs.baseline.result == 'success' ||
       (needs.baseline.result == 'skipped' && needs.plan.outputs.mode == 'in-diff'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # A free organisation has 20 concurrent jobs; the sweep takes ten so
      # pull-request CI is not queued behind it for days.
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # cargo-mutants builds in a copy of the tree; pointing it at the
      # restored target keeps the dependencies warm there too.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MUTANTS_BASELINE: ${{ needs.plan.outputs.mode == 'full' && 'skip' || 'run' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutants
          save-if: false
      - name: Fetch the plan
        uses: actions/download-artifact@v8
        with:
          name: mutants-plan
          path: plan
      - name: Run shard ${{ matrix.shard }} of ${{ needs.plan.outputs.shards }}
        timeout-minutes: 300
        run: |
          set -eu
          install -m 0755 plan/cargo-mutants "$HOME/.cargo/bin/cargo-mutants"
          # shellcheck disable=SC2046
          scripts/mutants-sweep.sh shard "${{ matrix.shard }}" "${{ needs.plan.outputs.shards }}" out $(cat plan/args)
      - name: Upload shard ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  summary:
    name: Mutation summary
    needs: [plan, baseline, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Refuse a sweep whose jobs did not all succeed
        run: |
          set -eu
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "::error::the plan job ended '${{ needs.plan.result }}': nothing was measured."
            exit 1
          fi
          if [ "${{ needs.plan.outputs.total }}" = "0" ]; then
            echo "No mutants in the diff; nothing to measure."
            exit 0
          fi
          baseline="${{ needs.baseline.result }}"
          if [ "${{ needs.plan.outputs.mode }}" = "in-diff" ] && [ "$baseline" = "skipped" ]; then
            baseline=success
          fi
          for job in "baseline:$baseline" "shard:${{ needs.shard.result }}"; do
            if [ "${job#*:}" != "success" ]; then
              echo "::error::the ${job%%:*} job(s) ended '${job#*:}': the sweep is incomplete, so its kill rate is not a measurement."
              exit 1
            fi
          done
      - name: Fetch every shard
        if: needs.plan.outputs.total != '0'
        uses: actions/download-artifact@v8
        with:
          pattern: mutants-shard-*
          path: shards
          merge-multiple: true
      - name: Merge the shards and refuse a blind sweep
        if: needs.plan.outputs.total != '0'
        run: |
          set -eu
          gate=""
          if [ "${{ needs.plan.outputs.mode }}" = "in-diff" ]; then
            gate="--fail-on-missed"
          fi
          python3 scripts/mutants-summary.py shards \
            --shards "${{ needs.plan.outputs.shards }}" \
            --expected-total "${{ needs.plan.outputs.total }}" \
            $gate
      - name: Upload the merged outcomes
        if: always() && needs.plan.outputs.total != '0'
        uses: actions/upload-artifact@v7
        with:
          name: mutants-${{ needs.plan.outputs.mode }}
          path: shards/outcomes-merged.json
          retention-days: 30
          if-no-files-found: warn
