[package]
name = "axess-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axess-macros"
readme = "README.md"
resolver = "3"
description = "Auth guard macros for axess: require_authn!, require_partial_authn!, require_authz! for Axum handlers."
keywords = ["authentication", "axum", "macro", "middleware"]
categories = ["web-programming", "authentication"]

# docs.rs renders the macro crate the same way as the rest.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Mirror axess-core's defaults EXCEPT `authz` (cedar-policy is heavy and
# only needed when this crate's own `authz` feature is on, which forwards
# `axess-core/authz` explicitly below). Without these, axess-macros built
# standalone (as `cargo publish` does in its verify step) fails because
# axess-core's `SessionData` derives Serialize over fields whose Serialize
# impls live behind `axess-identity/serde`.
axess-core = { workspace = true, features = ["device", "default-error-response", "serde"] }
form_urlencoded = "1.2.2"
cedar-policy = { version = "4.11.2", optional = true }

[features]
# `authz` enables the `require_authz!` Cedar gating macro.
# Pulls in `cedar-policy` and turns on `axess-core/authz` so the macro
# can reference `axess_core::authz::*` types in its expansion.
authz = ["dep:cedar-policy", "axess-core/authz"]
