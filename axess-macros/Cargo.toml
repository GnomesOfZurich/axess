[package]
name = "axess-macros"
version = "0.0.5"
publish = false
edition = "2024"
resolver = "3"
description = "Procedural macros for Axess, providing convenient middleware and request extractors."
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"
repository = "https://github.com/GnomesOfZurich/axess"

[dependencies]
axess-core = { path = "../axess-core",  default-features = false, features = ["authn"]  }
urlencoding = "2.1.3"
form_urlencoded = "1.2.2"
