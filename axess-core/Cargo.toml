[package]
name = "axess-core"
version = "0.0.7"
publish = false
edition = "2024"
resolver = "3"
description = """
Authentication and Authorization for the Axum webframework. Providing a set of convenient middleware and related request extractors.
Built on top of the tower-sessions crate for authentication and Cedar Policy for authorization. Additionally including helpers for
request tracing and request id generation.
"""
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"
repository = "https://github.com/GnomesOfZurich/axess"
# homepage = "https://getgnomes.com/tech/axum-access"
# documentation = "https://docs.rs/axum-access"
keywords = ["authentication", "authorization", "axum", "login", "session"]
categories = ["web-programming"]

[dependencies]
# Core dependencies (always included)
async-trait = { version = "0.1.89" }
axess-factors = { path = "../axess-factors" }
base64 = "0.22.1"
# getrandom = "0.3.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = { version = "2.0.17" }
tokio = { version = "1.48.0", features = ["full", "macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["full"] }
tower-sessions = { version = "0.14.0" }
tower-cookies = { version = "0.11.0", features = ["axum-core", "private", "signed"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.41"
axum = { version = "0.8.6", default-features = false, features = [
  "original-uri",
  "form",
  "json"
] }
# axum = { version = "0.8.4", features = [
#   "http2",
#   "json",
#   "tokio",
#   "tower-log",
#   "form",
#   "ws",
#   "query",
#   "tracing",
#   "macros",
#   "matched-path",
#   "multipart",
#   "original-uri",
# ] }

# Feature-gated dependencies
aes-gcm = { version = "0.10.3", optional = true }
# hex = { version = "0.4.3", optional = true }
rmp-serde = { version = "1.3.0", optional = true }
subtle = { version = "2.6.1", optional = true }
chrono = { version = "0.4.42", features = ["serde"], optional = true }
dashmap = { version = "6.1.0", features = ["serde"], optional = true }
fred = { version = "10.1.0", features = [
  "transactions",
  "i-std",
  "i-cluster",
  "blocking-encoding",
  "replicas",
], optional = true }
lazy-regex = { version = "3.4.1" }
once_cell = { version = "1.21.3", optional = true }

time = { version = "0.3.44", features = ["serde"], optional = true }
# rand_core = "0.9.3"
rand = { version = "0.8.5", features = ["std"] , optional = true }
sha2 = { version = "0.10.9" }
uuid = { version = "1.18.1", features = ["v4"], optional = true }
urlencoding = { version = "2.1.3", optional = true }
form_urlencoded = { version = "1.2.2", optional = true }
cedar-policy = { version = "4.7.0", optional = true }
tracing-subscriber = { version = "0.3.20", features = ["fmt"], default-features = false }


[dev-dependencies]
argon2 = { version = "0.5.3", features = ["default"] }
axum = "0.8.6"
# password-auth = { version = "1.0.0" }
reqwest = { version = "0.12.24", features = ["cookies"] }
serial_test = "3.2.0" # Allows for the creation of serialised Rust tests
# tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }


# tracing-mock = "=0.1.0-beta.1"

[features]
authn = [
  "dep:chrono",
  "dep:dashmap",
  "dep:time",
  "dep:rand",
  "dep:urlencoding",
  "dep:form_urlencoded"
]
authz = ["authn", "dep:cedar-policy"]
admin = ["authn"]
accept_client_id = []
request_id = ["dep:uuid"]
trace_id = ["dep:uuid"]
memory = ["dep:dashmap"]
valkey = [
  "dep:fred",
  "dep:aes-gcm",
  # "dep:hex",
  "dep:rmp-serde",
  "dep:subtle",
  "dep:once_cell"
]
default = ["authz", "admin"]
full = ["default", "request_id", "trace_id", "valkey"]
