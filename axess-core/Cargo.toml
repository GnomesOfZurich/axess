[package]
name = "axess-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axess-core"
readme = "README.md"
description = """
Core implementation for the axess library. Session state machine, multi-factor
authentication engine, Cedar Policy evaluation, and pluggable storage backends.
Use the `axess` facade crate unless you need direct access to internals.
"""
keywords = ["authentication", "authorization", "axum", "session", "cedar"]
categories = ["web-programming", "authentication"]
exclude = ["tests/", "benches/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Workspace internal
axess-cache = { workspace = true }
axess-clock = { workspace = true }
axess-factors = { workspace = true }
axess-identity = { workspace = true, features = ["serde"] }
axess-rng = { workspace = true }

# External
aes-gcm = { workspace = true }
# The policy swap slot: a wait-free read on the request path (already in the
# tree through `fred`).
arc-swap = "1.9.3"
axum = { workspace = true, default-features = false, features = ["original-uri", "form", "json", "query", "tokio"] }
base64 = { workspace = true }
cedar-policy = { version = "4.14.1", optional = true }
chrono = { workspace = true, features = ["serde"] }
# Only what the Valkey code calls: the standard command families (`i-std`),
# `EVAL` (`i-scripts`) and the pub/sub client of the policy reload
# (`subscriber-client`). No transactions, replica routing or cluster commands.
# `blocking-encoding` stays: it keeps large-frame encoding off the runtime
# thread, and it is what enables tokio's `rt-multi-thread` for a Valkey build.
fred = { version = "10.1.0", default-features = false, features = ["i-std", "i-scripts", "subscriber-client", "blocking-encoding"], optional = true }
hmac = { workspace = true }
# No backend here either: see axess-factors' note. The adopter picks with
# `jwt-aws-lc` or `jwt-rust-crypto`, which this crate passes through.
jsonwebtoken = { version = "11.1.0", default-features = false, optional = true }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"], optional = true }
# `timing-resistant-secret-traits` makes secret-bearing types refuse
# `PartialEq` / `Hash` derives: the property an auth library wants from
# its OIDC client.
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"], optional = true }
# 0.13 to match jsonwebtoken's transitive pin. openidconnect 4.1 and
# webauthn-rs (through crypto-glue) are on 0.14, so a build with `oauth` or
# `fido2` carries both. 0.14 additionally needs elliptic-curve 0.14 and drops the `jwk`
# feature selected here.
# Carries crypto-bigint 0.5.5 (RUSTSEC-2026-0387, accepted in deny.toml):
# the upstream pins keep it in the tree whatever this line says.
p256 = { version = "0.13.2", features = ["ecdsa", "jwk"], optional = true }
quick-xml = { workspace = true, optional = true }
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
# 0.12 to match openidconnect's transitive pin; avoids a duplicate-major.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"], optional = true }
rkyv = { workspace = true, optional = true }
rmp-serde = { version = "1.3.1", optional = true }
# RUSTSEC-2023-0071 (Marvin Attack on PKCS#1 v1.5 decryption) does not
# apply here: only used for signature mint+verify in LocalIdp fixtures.
rsa = { version = "0.9.10", features = ["pkcs5"], optional = true }
# Adopter installs the CryptoProvider at process startup (aws-lc-rs / ring):
# this crate stays cipher-agnostic.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"], optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# No default features: `any`, `migrate` and `json` are unused here, and the
# default `macros` pulls the `sqlx-macros` proc-macro (which can open a
# database at build time). `derive` is the one macro surface used
# (`FromRow`). The backend and TLS choice stay with the features below and
# the adopter.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "derive"], optional = true }
subtle = { workspace = true }
thiserror = { workspace = true }
# Listed per use: `sync` (channels, `Semaphore`), `time` (timeouts, intervals),
# `rt` (`spawn`, `spawn_blocking`, `Handle::try_current`) and `macros`
# (`select!`, `join!`). No `full` and no `rt-multi-thread`: a library does not
# choose the runtime flavour, the application does.
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
cookie = { version = "0.18.2", features = ["percent-encode"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
# `danger-allow-state-serialisation` is required to store a
# ceremony's registration/authentication state between the two requests;
# keep that state SERVER-SIDE only (never in a cookie or any field the
# client can read or return), because it is the ceremony's trust anchor.
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"], optional = true }
x509-parser = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
# Foundation crates' `testing` features are gated; tests pull them via
# dev-deps overrides so `cargo test` sees `axess_clock::testing::MockClock`
# etc. without forcing production builds to compile the mocks.
axess-clock = { workspace = true, features = ["testing", "allow-testing-in-release"] }
axess-factors = { workspace = true, features = ["testing", "allow-testing-in-release"] }
axess-identity = { workspace = true, features = ["testing"] }
axess-rng = { workspace = true, features = ["testing", "allow-testing-in-release"] }
# The tracing capture and the OIDC identity-provider fixture: a dev-dependency
# only, so `wiremock` and its `rsa` are reachable from no production edge.
axess-testing = { workspace = true }
base32 = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
http-body-util = "0.1.5"
proptest = { workspace = true }
# rcgen mints X509-SVID certs with SPIFFE URIs in SAN for mTLS resolver tests.
rcgen = "0.14.10"
# Match the production `outbound-oauth` reqwest pin: rustls only, so
# `native-tls` and `openssl-sys` stay out of the lockfile. `json` is the live
# Keycloak test's response decoding.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "json"] }
# rmp-serde is normally feature-gated (sqlite/postgres/valkey); pull into
# dev-deps so the wire-format proptest suite runs independently of storage.
rmp-serde = "1.3.1"
# The WebSocket tests serve over a real socket, which needs axum's HTTP/1
# server; the library itself stays transport-agnostic.
axum = { workspace = true, features = ["http1", "ws"] }
rsa = { version = "0.9.10", features = ["pkcs5"] }
serial_test = "4.0.1"
sha1 = { workspace = true }
# `tls-rustls-aws-lc-rs`: MySQL 8 signs in with `caching_sha2_password`, which
# needs TLS (or an RSA exchange); the live MySQL tests connect over TLS.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "derive", "sqlite", "postgres", "tls-rustls-aws-lc-rs"] }
subtle = { workspace = true }
# Test directories that are removed on drop, also when an assertion fails.
tempfile = "3.27.0"
# Satisfies `#[cfg(test)] mod tests` in authz/audit.rs and the doc-test
# examples. A library leaves the subscriber to the binary: installing one is
# the application's decision, and two libraries that both install one
# conflict.
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
# In-crate `#[cfg(test)]` mods and the integration tests build wiremock
# fixtures directly. Not a regular dependency under any feature.
wiremock = "0.6.5"

[[bench]]
name = "session_layer"
harness = false
required-features = ["memory", "sqlite"]

[[bench]]
name = "ratelimit"
harness = false

[features]
default = ["authz", "device", "default-error-response", "serde"]

# Core capabilities
authz = ["dep:cedar-policy"]
device = []
default-error-response = []
memory = []
# Implies `memory` because the test helpers build on the in-memory backends.
# Forwards `testing` to every foundation crate that exposes a
# feature-gated `testing` surface (uniform-gate workspace policy).
testing = [
    "memory",
    "axess-factors/testing",
    "axess-clock/testing",
    "axess-rng/testing",
    "axess-identity/testing",
]
# The named opt-out for the release-build guard: with `testing` on and
# debug assertions off the crate refuses to compile, because the feature
# ships test doubles in a production binary. Enable this only for a build
# that means it (a benchmark, a release-mode test run).
allow-testing-in-release = [
    "axess-clock/allow-testing-in-release",
    "axess-rng/allow-testing-in-release",
    "axess-factors/allow-testing-in-release",
]

# HTTP middleware
accept-client-id = []
request-id = []
service-secret = []
trace-id = []
ws = ["axum/ws"]

# Federated authn / OIDC
# An alias for `oauth`, which carries the FAPI 2.0 client profile and both
# halves of DPoP.
fapi = ["oauth", "axess-factors/fapi"]
fido2 = ["dep:webauthn-rs", "axess-factors/fido2"]
# Generic JWT primitives + `WorkloadResolver` for non-SPIFFE
# workload-identity flows. Adopters reach for this when wiring
# GitHub Actions OIDC, Kubernetes SA, GitLab CI, Okta, Azure AD,
# Auth0, etc. via a custom claim parser. SPIFFE adopters get the
# same primitives transitively via `jwt-svid`.
jwt = ["axess-factors/jwt"]
# The crypto backend `jsonwebtoken` verifies with, passed through: enable
# exactly one beside `jwt`. See axess-factors' features for the trade.
jwt-aws-lc = ["jwt", "axess-factors/jwt-aws-lc", "jsonwebtoken?/aws_lc_rs"]
jwt-rust-crypto = ["jwt", "axess-factors/jwt-rust-crypto", "jsonwebtoken?/rust_crypto"]
jwt-svid = ["jwt", "axess-factors/jwt-svid"]
ldap = ["dep:ldap3", "axess-factors/ldap"]
mtls = ["dep:x509-parser", "dep:rustls-pki-types", "axess-factors/mtls"]
oauth = ["dep:openidconnect", "dep:jsonwebtoken", "axess-factors/oauth"]
# Plain-OAuth-2.0 user login. OFF BY DEFAULT: see
# `axess_factors::social` module docs for the security model and when
# to reach for this vs OIDC.
social = ["axess-factors/social"]

# Outbound authn (axess as client)
outbound-mtls = ["dep:rustls", "dep:rustls-pki-types"]
outbound-oauth = ["axess-factors/outbound-oauth"]

# On-behalf-of access (axess acting as the user at a downstream service).
# Source lives in `src/delegated/`. `oauth` / `outbound-oauth` carry
# `openidconnect` + `url` + `jsonwebtoken`; `dep:reqwest` covers the
# direct HTTP client the exchange + stored flows use.
delegated = ["delegated-stored", "delegated-stored-encrypted", "delegated-exchange"]
delegated-exchange = ["outbound-oauth", "dep:reqwest"]
delegated-stored = ["oauth", "outbound-oauth", "dep:reqwest"]
delegated-stored-encrypted = ["delegated-stored"]

# Cloud STS: federated workload-identity → cloud temporary credentials
aws-sts = ["axess-factors/http-body", "dep:reqwest", "dep:quick-xml"]
azure-fic = ["axess-factors/http-body", "dep:reqwest"]
cloud-sts = ["aws-sts", "gcp-wif", "azure-fic"]
gcp-wif = ["axess-factors/http-body", "dep:reqwest"]

# In-process IdP: mints workload JWTs for tests + on-host issuance
# Primitive types (`LocalIdpSigningKey`, `MintClaims`, `IssuanceListener`)
# live in `axess-core/src/local_idp/primitives.rs` and are shared between
# the production `crate::local_idp::LocalIdp` and the test fixture
# `crate::testing::local_idp::LocalIdpFixture`. `local-idp` therefore no
# longer transitively pulls `testing` (the mock-store fixtures stay opt-in).
local-idp = ["axess-factors/jwt", "dep:jsonwebtoken", "dep:rsa", "dep:p256"]

# Authz entity cache decorators (`EntityCache` is the in-tree default; this
# is the opt-in shared alternative).
valkey-cache = ["authz", "valkey"]

# Session storage backends
mysql = ["dep:sqlx", "sqlx/mysql", "dep:rmp-serde", "sqlx"]
postgres = ["dep:sqlx", "sqlx/postgres", "dep:rmp-serde", "sqlx"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "dep:rmp-serde", "sqlx"]
valkey = ["dep:fred", "dep:rmp-serde"]

# Audit archive reference implementations. `audit-archive-fs` ships a
# filesystem-backed `AuditArchiver` that appends JSONL records to a
# rotating path: minimal deps, suitable for prototyping and on-prem
# deployments that mount cold storage as a filesystem. Production
# cloud adopters typically wire their own S3 / Object Lock sink.
audit-archive-fs = []

# Forwarding features for the `axess_identity::define_id!` macro. These exist
# so `#[cfg(feature = "serde")]` / `#[cfg(feature = "rkyv")]` /
# `#[cfg(feature = "sqlx")]` evaluate correctly in this crate's expansion
# context and the gated trait impls aren't silently dropped.
rkyv = ["axess-identity/rkyv", "dep:rkyv"]
serde = ["axess-identity/serde"]
sqlx = ["axess-identity/sqlx"]

# Discoverability umbrellas: purely additive.
#
# No `full` umbrella by design. It bundled mutually-exclusive session
# backends (sqlite + postgres + valkey) and duplicated `--all-features`
# without serving a real adopter shape. Pick one session backend +
# the federation / middleware / workload features you actually need;
# use `cargo … --all-features` for CI / docs.rs only.
# `WorkloadResolver` itself lives under `jwt`, exposed via the
# `crate::workload::workload` re-export. Adopters writing custom
# claim mappers for non-SPIFFE issuers (GitHub Actions, k8s SA,
# GitLab CI, …) enable `jwt` directly or any feature in this
# umbrella to get the resolver compiled in.
workload-id = ["jwt", "jwt-svid", "mtls", "outbound-oauth", "outbound-mtls"]
