[package]
name = "axess-core"
version = "0.0.14"
publish = false
edition = "2024"
resolver = "3"
description = """
Authentication and Authorization for the Axum webframework. Providing a set of convenient middleware and related request extractors.
Custom session layer with HMAC-signed cookies and Cedar Policy for authorization. Additionally including helpers for
request tracing and request id generation.
"""
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"
repository = "https://github.com/GnomesOfZurich/axess"
keywords = ["authentication", "authorization", "axum", "login", "session"]
categories = ["web-programming"]

[dependencies]
# Core dependencies (always included)
axess-factors = { path = "../axess-factors" }
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = { version = "2.0.18" }
tokio = { version = "1.50.0", features = ["full", "macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["full"] }
tower-cookies = { version = "0.11.0", features = ["axum-core"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.44"
axum = { version = "0.8.8", default-features = false, features = [
  "original-uri",
  "form",
  "json"
] }

# Always-on: session layer, IDs, clocks
uuid = { version = "1.19.0", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["serde"] }
hmac = "0.12"
sha2 = { version = "0.10.9" }
subtle = { version = "2.6.1" }
rand = { version = "0.10.0", features = ["std"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
lazy-regex = { version = "3.6.0" }

# Feature-gated dependencies
aes-gcm = { version = "0.10.3", optional = true }
hex = { version = "0.4.3", optional = true }
rmp-serde = { version = "1.3.1", optional = true }
once_cell = { version = "1.21.4", optional = true }
urlencoding = { version = "2.1.3", optional = true }
form_urlencoded = { version = "1.2.2", optional = true }
cedar-policy = { version = "4.9.1", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["fmt"], default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }

fred = { version = "10.1.0", features = [
  "transactions",
  "i-std",
  "i-cluster",
  "blocking-encoding",
  "replicas",
], optional = true }


[dev-dependencies]
argon2 = { version = "0.5.3", features = ["default"] }
reqwest = { version = "0.13.2", features = ["cookies"] }
serial_test = "3.4.0"


[features]
authz = ["dep:cedar-policy"]
admin = []
accept_client_id = []
request_id = []
trace_id = []
memory = []
sqlite = ["dep:sqlx"]
valkey = [
  "dep:fred",
  "dep:aes-gcm",
  "dep:rmp-serde",
  "dep:once_cell",
  "dep:hex",
]
default = ["authz"]
full = ["default", "request_id", "trace_id", "sqlite", "valkey"]
