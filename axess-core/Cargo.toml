[package]
name = "axess-core"
version = "0.0.1"
publish = false
edition = "2024"
resolver = "3"
description = """
Authentication and Authorization for the Axum webframework. Providing a set of convenient middleware and related request extractors.
Built on top of the tower-sessions crate for authentication and Cedar Policy for authorization. Additionally including helpers for
request tracing and request id generation.
"""
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"
repository = "https://github.com/GnomesOfZurich/axess"
# homepage = "https://getgnomes.com/tech/axum-access"
# documentation = "https://docs.rs/axum-access"
keywords = ["authentication", "authorization", "axum", "login", "session"]
categories = ["web-programming"]

[dependencies]
# anyhow = { version = "1.0.98" }
aes-gcm = "0.10.3"
async-trait = { version = "0.1.88" }
base64 = "0.22.1"
hex = "0.4.3"
rmp-serde = { version = "1.3.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
subtle = "2.6.1"
thiserror = { version = "2.0.12" }
chrono = { version = "0.4.41", features = ["serde"] }
dashmap = { version = "6.1.0", features = ["serde"] }
fred = { version = "10.1.0", features = [
  "transactions",
  "i-std",
  "i-cluster",
  "blocking-encoding",
  "replicas",
] }
lazy-regex = { version = "3.4.1" }
once_cell = { version = "1.21.3" }
password-auth = "1.0.0"
tokio = { version = "1.47.0", features = ["full", "macros", "rt-multi-thread"] }
tower = { version = "0.5.2", features = ["full"] }
tower-sessions = { version = "0.14.0" }
tower-cookies = { version = "0.11.0", features = ["axum-core", "private", "signed"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
# tower-http = { version = "0.6.2", features = ["full"] }
# tower = { version = "0.5.2", features = ["full"] }
time = { version = "0.3.41", features = ["serde"] }
totp-rs = { version = "5.7.0", features = [
  "gen_secret",
  "serde_support",
  "zeroize",
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
rand = { version = "0.9.2" }
uuid = { version = "1.18.0", features = ["v4"] }
urlencoding = "2.1.3"
form_urlencoded = "1.2.1"
cedar-policy = { version = "4.5.1"}
axum = { version = "0.8.4", default-features = false, features = [
  "original-uri",
  "form",
  "json"
] }

[dev-dependencies]
reqwest = { version = "0.12.23", features = ["cookies"] }
serial_test = "3.2.0" # Allows for the creation of serialised Rust tests
axum = "0.8.4"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
argon2 = { version = "0.5.3", features = ["default"] }
password-auth = { version = "1.0.0" }
# axum = { version = "0.8.4", features = [
#   "http2",
#   "json",
#   "tokio",
#   "tower-log",
#   "form",
#   "ws",
#   "query",
#   "tracing",
#   "macros",
#   "matched-path",
#   "multipart",
#   "original-uri",
# ] }

[features]
authn = []
authz = ["authn"]
admin = ["authn"]
# The `accept_client_id` is a sub-feature belonging to the `request_id` feature; not recommended for production purposes!
accept_client_id = []
request_id = []
trace_id = []
memory = []
valkey = []
default = ["authz", "admin"]
full = ["default", "request_id", "trace_id", "valkey"]
