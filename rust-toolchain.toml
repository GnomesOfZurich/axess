# Pinned, not `stable`.
#
# `channel = "stable"` means any `rustup update` can change the compiler under
# a checkout that did not change. That is not theoretical here: a stable bump
# introduced `clippy::chunks_exact_to_as_chunks`, which fired on hex-decoding
# code untouched since the 0.2.0 release, and because the clippy gate runs with
# `-D warnings` it turned the whole of `scripts/test-all.sh` red on main with
# no commit responsible for it.
#
# Pinning makes a toolchain change a deliberate edit to this file, arriving
# with the lint fixes it requires, instead of arriving unannounced on whichever
# machine updated rustup first.
#
# This is the *development* toolchain and is unrelated to the MSRV that
# adopters get, which is `rust-version` in the workspace Cargo.toml
# and is exercised by the `msrv` job in .github/workflows/ci.yml. That job
# still works: it installs the version read from Cargo.toml and sets
# `RUSTUP_TOOLCHAIN`, which takes precedence over this file, so it continues to
# compile against the MSRV rather than against this pin.
#
# To move: bump `channel`, run `./scripts/test-all.sh`, and fix whatever new
# lints the bump brings in the same commit.
[toolchain]
channel = "1.98.0"
# Named explicitly so a fresh checkout or a CI runner using a minimal profile
# still has the tools the gates need, rather than failing on a missing binary.
components = ["clippy", "rustfmt"]
