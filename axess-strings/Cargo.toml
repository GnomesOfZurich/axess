[package]
name = "axess-strings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axess-strings"
readme = "README.md"
description = """
Immutable short-string primitive for identifiers that are cloned, hashed
and compared at high volume: event subject ids, taxonomy tags, key ids.
A 24-byte value holding up to 22 bytes inline, referencing `&'static str`
in place, and sharing anything longer through an `Arc<str>` so a clone is
a refcount bump rather than an allocation. Contains no unsafe code.
"""
keywords = ["string", "identifier", "immutable", "short-string", "compact"]
categories = ["data-structures", "no-std"]
exclude = ["tests/", "benches/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `serde` is on by default: JSON is the dominant axum / frontend / SQL
# audit-log surface for any axess consumer. `rkyv` is opt-in: enable it
# when publishing events to Iggy or other binary streams. `full` is a
# convenience for org-internal builds that want both.
default = ["serde"]
serde = ["dep:serde"]
rkyv = ["dep:rkyv"]
full = ["serde", "rkyv"]

[dependencies]
serde = { version = "1.0.229", optional = true, default-features = false, features = ["alloc"] }
# axess-strings only needs `["alloc", "bytecheck"]`; the workspace pin
# adds `uuid-1` which is harmless here (no uuid types used) but keeps
# the feature set uniform across the workspace.
rkyv = { workspace = true, optional = true }

[dev-dependencies]
# `std` explicitly: the workspace pin is `default-features = false`, and in a
# full-workspace build another member happens to switch `std` on, so this
# crate's own tests compiled by accident. On its own (`cargo test -p
# axess-strings`, and so `cargo miri test -p axess-strings`) nothing did, and
# `serde_json` failed its own `compile_error!`.
serde_json = { workspace = true, features = ["std"] }
criterion = { workspace = true }
# Benchmark-only. `benches/short_string.rs` guards the claim that decided
# this crate's existence: above the inline cap, `CompactString::clone`
# reallocates and copies where `ShortString::clone` bumps a refcount.
compact_str = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "short_string"
harness = false
