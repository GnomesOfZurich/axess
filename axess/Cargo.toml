[package]
name = "axess"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/axess"
readme = "README.md"
description = """
Modular authentication and authorization for Axum. Typed session state machine,
multi-factor authentication (password, TOTP, FIDO2, OAuth/OIDC), Cedar Policy
authorization, and deterministic simulation testing.
"""
keywords = ["authentication", "authorization", "axum", "mfa", "session"]
categories = ["web-programming", "authentication"]
exclude = ["/.github", "/examples", "/scripts", "tests/"]

[package.metadata.docs.rs]
# Every feature but `sqlite-unbundled`, which needs libclang and the
# system's SQLite header at build time; `sqlite` documents the same
# stores. `all-features = true` would switch it on, on a machine this
# project does not control. scripts/check-docsrs-features.sh holds this
# list to `[features]`: a feature in neither it nor the script's named
# exclusions fails the check.
features = [
    "authz",
    "device",
    "device-keys",
    "memory",
    "testing",
    "allow-testing-in-release",
    "accept-client-id",
    "request-id",
    "service-secret",
    "trace-context",
    "ws",
    "fapi",
    "fido2",
    "jwt",
    "jwt-aws-lc",
    "jwt-rust-crypto",
    "jwt-svid",
    "ldap",
    "mtls",
    "oauth",
    "social",
    "aws-sts",
    "azure-fic",
    "cloud-sts",
    "gcp-wif",
    "outbound-mtls",
    "outbound-oauth",
    "client-assertion-rsa",
    "delegated",
    "delegated-exchange",
    "delegated-stored",
    "delegated-stored-encrypted",
    "local-idp",
    "spire",
    "local-idp-rsa",
    "mysql",
    "postgres",
    "sqlite",
    "valkey",
    "valkey-cache",
    "audit-archive-fs",
    "workload-id",
]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# `features` restates axess-core's defaults: the workspace entry sets
# `default-features = false` so axess-macros can opt out, and this re-adds
# the surface the facade has always relied on.
axess-core = { workspace = true, features = ["authz", "device", "default-error-response", "serde"] }
axess-factors = { workspace = true }
# Re-exports `testing::tenant` / `testing::user` so consumers can write
# `axess::testing::tenant("alice")` without taking an axess-identity dep.
# `features = ["serde"]` restores the default the workspace entry strips.
axess-identity = { workspace = true, features = ["serde"] }
axess-macros = { workspace = true }
axum = { workspace = true, default-features = false, features = ["json"] }
cedar-policy = { version = "4.14.1", optional = true }
serde_json = { workspace = true }

[dev-dependencies]
axess-testing = { workspace = true }
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
# Compiles the program in tests/ui that names `axess::testing` without the
# feature and checks the compiler refuses it. Dev-only: it never reaches an
# adopter's build.
trybuild = "1.0.122"

[features]
default = ["authz", "device"]

# Core capabilities
authz = ["axess-core/authz", "axess-macros/authz", "dep:cedar-policy"]
device = ["axess-core/device"]
# Device keys: sessions and devices held to a key the client cannot export
# (`axess::device_key`). Needs `jwt-aws-lc` or `jwt-rust-crypto` beside it.
device-keys = ["device", "axess-core/device-keys"]
memory = ["axess-core/memory"]
testing = ["axess-core/testing", "axess-factors/testing", "axess-identity/testing", "memory"]
# The named opt-out for the release-build guard: with `testing` on and
# debug assertions off the crate refuses to compile, because the feature
# ships test doubles in a production binary. Enable this only for a build
# that means it (a benchmark, a release-mode test run).
allow-testing-in-release = ["axess-core/allow-testing-in-release", "axess-factors/allow-testing-in-release", "axess-identity/allow-testing-in-release"]

# HTTP middleware
accept-client-id = ["axess-core/accept-client-id"]
request-id = ["axess-core/request-id"]
service-secret = ["axess-core/service-secret"]
trace-context = ["axess-core/trace-context"]
ws = ["axess-core/ws"]

# Federated authn
# An alias for `oauth`.
fapi = ["oauth", "axess-core/fapi"]
fido2 = ["axess-core/fido2"]
# Generic JWT-bearer workload identity. Pulls the `WorkloadResolver`
# adopters wire against GitHub Actions OIDC, Kubernetes SA, GitLab CI,
# Okta, Azure AD, Auth0, etc. via a custom claim parser. SPIFFE
# adopters get the same primitives via `jwt-svid`.
jwt = ["axess-core/jwt"]
# The crypto backend, passed through from axess-factors: enable exactly one
# beside `jwt`. `jwt-aws-lc` is FIPS-capable and needs a C toolchain (and NASM
# on Windows); `jwt-rust-crypto` is pure Rust and builds anywhere.
jwt-aws-lc = ["jwt", "axess-core/jwt-aws-lc"]
jwt-rust-crypto = ["jwt", "axess-core/jwt-rust-crypto"]
jwt-svid = ["jwt", "axess-core/jwt-svid"]
ldap = ["axess-core/ldap"]
mtls = ["axess-core/mtls"]
oauth = ["axess-core/oauth"]
# Plain-OAuth-2.0 user login. OFF BY DEFAULT: see
# `axess::social` module docs for the security model and when to reach
# for this vs OIDC.
social = ["axess-core/social"]

# Outbound + cloud STS
aws-sts = ["axess-core/aws-sts"]
azure-fic = ["axess-core/azure-fic"]
cloud-sts = ["aws-sts", "azure-fic", "gcp-wif", "axess-core/cloud-sts"]
gcp-wif = ["axess-core/gcp-wif"]
outbound-mtls = ["axess-core/outbound-mtls"]
outbound-oauth = ["axess-core/outbound-oauth"]
# RSA client keys for `private_key_jwt` on `jwt-rust-crypto`, a choice that
# signs in rsa 0.9 (RUSTSEC-2023-0071); see the feature in axess-factors.
client-assertion-rsa = ["axess-core/client-assertion-rsa"]

# OBO
delegated = [
    "delegated-exchange",
    "delegated-stored",
    "delegated-stored-encrypted",
    "axess-core/delegated",
]
delegated-exchange = ["axess-core/delegated-exchange"]
delegated-stored = ["axess-core/delegated-stored"]
delegated-stored-encrypted = ["axess-core/delegated-stored-encrypted"]

# In-process IdP. Its keys are ES256; `local-idp-rsa` adds RSA keys and with
# them the `rsa` crate, which carries RUSTSEC-2023-0071 (see the feature in
# axess-core's manifest).
local-idp = ["axess-core/local-idp"]
local-idp-rsa = ["local-idp", "axess-core/local-idp-rsa"]

# SPIFFE Workload API client: SVIDs and trust bundles from a local SPIRE
# agent, kept current by a watcher. Needs an agent, so no umbrella enables it.
spire = ["axess-core/spire"]

# Session storage backends
mysql = ["axess-core/mysql"]
postgres = ["axess-core/postgres"]
sqlite = ["axess-core/sqlite"]
# `sqlite` linked to the system's SQLite library; enable it in place of `sqlite`.
sqlite-unbundled = ["axess-core/sqlite-unbundled"]
valkey = ["axess-core/valkey"]

# Authz entity cache decorator (opt-in alternative to `EntityCache`)
valkey-cache = ["axess-core/valkey-cache", "valkey"]

# Audit archive: `FilesystemAuditArchiver`, the filesystem-backed reference
# `AuditArchiver`, re-exported under `axess::authn`.
audit-archive-fs = ["axess-core/audit-archive-fs"]

# Umbrellas
#
# No `full` umbrella by design. It bundled mutually-exclusive session
# backends (sqlite + postgres + mysql + valkey), pulled `testing` /
# `memory` into production builds, and duplicated `--all-features`
# without serving a real adopter shape. Pick one session backend +
# the federation / middleware / workload features you actually need;
# use `cargo … --all-features` for CI only.
workload-id = [
    "jwt",
    "jwt-svid",
    "mtls",
    "outbound-oauth",
    "outbound-mtls",
    "axess-core/workload-id",
]
