[package]
name = "axess-example-social"
version = "0.3.3"
edition = "2024"
rust-version = "1.93.1"
publish = false
resolver = "3"
description = """
Login with GitHub via axess's generic SocialProvider. Demonstrates the
plain-OAuth-2.0 user-login flow (no OIDC, no ID token, identity from a
TLS-trusted userinfo endpoint) for IdPs that don't support OIDC.
"""
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"
categories = ["web-programming", "authentication"]

[dependencies]
axess = { path = "../../axess", version = "=0.3.3", features = ["social", "memory"] }
axum = { version = "0.8.9", features = ["macros", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-cookies = { version = "0.11.0", features = ["axum-core"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
