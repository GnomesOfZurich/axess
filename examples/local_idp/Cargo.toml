[package]
name = "axess-example-local-idp"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
publish = false
resolver = "3"
description = "Production-grade in-process IdP example for the Axess library — file-backed key store with atomic rotation."
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"

[dependencies]
axess = { path = "../../axess", features = ["local-idp"] }
axum = { version = "0.8.9", features = ["json"] }
chrono = "0.4.44"
jsonwebtoken = "10.3.0"
rsa = { version = "0.9.10", features = ["pem"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
