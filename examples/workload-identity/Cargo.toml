[package]
name = "axess-example-workload-identity"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
publish = false
resolver = "3"
description = """
Adopter recipes for axess workload-identity federation. Shows how to wire
WorkloadResolver against GitHub Actions OIDC and Kubernetes service-account
projected tokens. Copy whichever recipe matches your IdP into your own code.
"""
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"
categories = ["authentication"]

[dependencies]
# `jwt` is the first-class facade feature gating the generic
# `WorkloadResolver` adopters program against for non-SPIFFE
# workload-identity flows (GitHub Actions, k8s SA, GitLab CI, …).
axess = { path = "../../axess", features = ["jwt"] }
axess-factors = { path = "../../axess-factors", features = ["jwt"] }
axess-identity = { path = "../../axess-identity" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"

[dev-dependencies]
# `axess_identity::PrincipalResolver` is the trait the integration
# tests call into; the workspace crate is already a runtime dep
# above, so the dev-dep just adds nothing extra.
axess-identity = { path = "../../axess-identity" }
# `MockClock` pins JwtVerifier's notion of "now" so the pinned JWT
# timestamps validate deterministically under DST.
axess-clock = { path = "../../axess-clock", features = ["testing"] }
base64 = "0.22"
chrono = "0.4.44"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
# `pkcs5` matches the workspace pin. The `pkcs1` *module* (used to
# DER-encode the test signing key) is unconditionally available.
rsa = { version = "0.9.10", features = ["pkcs5"] }
tokio = { version = "1.52.1", features = ["macros", "rt"] }
