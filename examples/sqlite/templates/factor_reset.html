<html>
  <head><title>Factor Reset</title></head>
  <body>
    <ul>
      {% for message in messages %}
      <li><strong>{{ message }}</strong></li>
      {% endfor %}
    </ul>
    <form method="post">
      <fieldset>
        <legend>Reset Authentication Factor</legend>
        <label for="username">Username</label>
        <input name="username" id="username" required />
        <label for="factor_kind">Factor Kind</label>
        <select name="factor_kind" id="factor_kind">
          <option value="Password">Password</option>
          <option value="Otp">TOTP</option>
        </select>
        <label for="tenant">Tenant</label>
        <input name="tenant" id="tenant" required />
        <label for="reason">Reason</label>
        <input name="reason" id="reason" />
      </fieldset>
      <button type="submit">Reset Factor</button>
    </form>
  </body>
</html>
