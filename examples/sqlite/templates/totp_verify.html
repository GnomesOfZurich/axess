<html>
  <head><title>Verify TOTP</title></head>
  <body>
    <form method="post">
      <fieldset>
        <legend>Verify TOTP</legend>
        <label for="otp_code">Code</label>
        <input name="otp_code" id="otp_code" required />
        <label for="tenant">Tenant</label>
        <input id="tenant" name="tenant" type="text" value="Default Tenant" required />
      </fieldset>
      <button type="submit">Verify</button>
    </form>
  </body>
</html>
