[package]
name = "axess-example-sqlite"
version = "0.10.0"
edition = "2024"
rust-version.workspace = true
publish = false
resolver = "3"
description = "The axess reference application on SQLite: signup, password and TOTP login with recovery codes, password reset, sessions, rate limiting; plus a device-identity demo (`--bin device`)."
default-run = "axess-example-sqlite"
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"
categories = ["web-programming"]

[dependencies]
# `sqlite` opts the storage backend in; `device` (used by `--bin device`) is
# in axess's default features.
axess = { path = "../../axess", version = "=0.10.0", features = ["sqlite"] }
axum = { version = "0.8.9", features = ["macros", "form"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
subtle = "2.6.1"
thiserror = { version = "2.0.20" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
# `tower::ServiceExt::oneshot` lets the smoke test drive the router
# without binding a real socket: faster, parallel-safe, no port
# allocation games.
tower = { version = "0.5.3", features = ["util"] }
# The second-factor test plays the authenticator app (`totp-rs`, the
# library axess verifies with) and posts forms (`serde_urlencoded`).
serde_urlencoded = "0.7.1"
totp-rs = "6.0.0"
