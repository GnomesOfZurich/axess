[package]
name = "axess-example-sqlite"
version = "0.0.14"
edition = "2024"
publish = false
resolver = "3"
description = "An example Axum web application using SQLite for session storage and authentication."
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"
repository = "https://github.com/GnomesOfZurich/axess"
categories = ["web-programming"]

[dependencies]
axess = { path = "../../axess", features = ["sqlite"] }
axess-factors = { path = "../../axess-factors" }
axum = { version = "0.8.8", features = ["macros", "form"] }
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.22.0", features = ["v4"] }
