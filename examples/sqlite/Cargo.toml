[package]
name = "axess-example-sqlite"
version = "0.0.2"
edition = "2024"
publish = false
resolver = "3"
description = "An example Axum web application using SQLite for session storage and authentication."
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"
repository = "https://github.com/GnomesOfZurich/axess"
categories = ["web-programming"]

[dependencies]
async-trait = { version = "0.1.89" }
askama = { version = "0.14.0" }
axess = { path = "../../axess", features= ["admin"] }
axum = { version = "0.8.4", features = ["macros", "form"] }
axum-messages = "0.8.0"
chrono = { version = "0.4.41", features = ["serde"] }
dotenv = "0.15"
sqlx = { version = "0.8.6", features = ["sqlite", "time", "runtime-tokio"] }
tokio = { version = "1.47.1", features = ["full"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tower-sessions = { version = "0.14.0", default-features = false, features = [
  "signed",
] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
password-auth = "1.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
time = "0.3.43"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
