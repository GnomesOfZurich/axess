[package]
name = "axess-example-device"
version = "0.3.0"
edition = "2024"
rust-version = "1.93.1"
publish = false
resolver = "3"
description = """
End-to-end device-identity wiring for axess: one SqlitePool shared
between SqliteSessionStore + SqliteDeviceStore, the
DefaultFingerprintExtractor, DeviceLifecycleService, CachedDeviceStore
decorator, LifecycleDeviceResolver Axum extractor, and a sweep
background task driving the three-stage retention ladder.
"""
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"
categories = ["web-programming"]

[dependencies]
# `device` is in axess default features; `sqlite` opts the storage backend in.
axess = { path = "../../axess", version = "=0.3.0", features = ["sqlite", "testing"] }
axess-clock = { path = "../../axess-clock", version = "=0.3.0" }
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
