[package]
name = "axess-example-fido2"
version = "0.20.0"
edition = "2024"
rust-version.workspace = true
publish = false
resolver = "3"
description = "FIDO2 and WebAuthn with axess: passkey, security-key and attested registration, username-first and passwordless login, cross-device authentication, and a step-up prompted by a Cedar policy."
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"

[lints]
workspace = true

[dependencies]
# `fido2` for the ceremonies; `authz` (a default feature) for the Cedar gate
# that asks for the step-up; `memory` for the in-process session store.
# Demo built on the in-memory backend of `testing`: a debug demo, so a release build of it is refused by the guard.
axess = { path = "../../axess", version = "=0.20.0", features = ["fido2", "memory", "testing"] }
axum = { version = "0.8.9", features = ["json"] }
# Credential ids travel as URL-safe base64 without padding, as WebAuthn
# writes them.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# `Entities` and `EntityUid`, which the entity provider of the gate names.
cedar-policy = "4.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = { version = "2.0.21" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The relying party (`WebauthnBuilder`) and the credential types the browser
# posts. The version is the one `axess` builds its `fido2` feature on.
webauthn-rs = "0.6.2"

[dev-dependencies]
# Mints the attestation root the attested-registration test trusts.
rcgen = "0.14.10"
# Drives the router in process: `ServiceExt::oneshot`.
tower = { version = "0.5.3", features = ["util"] }
