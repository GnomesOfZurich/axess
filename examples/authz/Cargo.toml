[package]
name = "axess-example-authz"
version = "0.2.1"
edition = "2024"
rust-version = "1.87"
publish = false
resolver = "3"
description = "Cedar Policy authorization example for the Axess library."
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"

[dependencies]
axess = { path = "../../axess", features = ["authz"] }
axum = { version = "0.8.9", features = ["json"] }
cedar-policy = "4.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
thiserror = "2.0.19"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
