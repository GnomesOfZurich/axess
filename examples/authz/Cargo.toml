[package]
name = "axess-example-authz"
version = "0.0.14"
edition = "2024"
publish = false
resolver = "3"
description = "Cedar Policy authorization example for the Axess library."
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"
repository = "https://github.com/GnomesOfZurich/axess"

[dependencies]
axess = { path = "../../axess", features = ["authz"] }
axum = { version = "0.8.8", features = ["json"] }
cedar-policy = "4.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
thiserror = "2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
