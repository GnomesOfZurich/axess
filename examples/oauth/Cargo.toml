[package]
name = "axess-example-oauth"
version = "0.16.0"
edition = "2024"
rust-version.workspace = true
publish = false
resolver = "3"
description = "Federated login with axess: OpenID Connect (the default binary) and plain OAuth 2.0 social login for providers without OIDC, such as GitHub (`--bin social`)."
default-run = "axess-example-oauth"
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"

[dependencies]
# `oauth` + `jwt-rust-crypto` for OIDC; `social` + `memory` for `--bin social`.
axess = { path = "../../axess", version = "=0.16.0", features = ["oauth", "jwt-rust-crypto", "testing", "social", "memory"] }
# `Algorithm` names the signing algorithm of a `private_key_jwt` key. No crypto
# backend here: `axess`'s `jwt-rust-crypto` feature picks the one provider, and
# a second one makes `jsonwebtoken` refuse to choose.
jsonwebtoken = { version = "11.1.0", default-features = false }
axum = { version = "0.8.9", features = ["json", "form", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-cookies = { version = "0.11.0", features = ["axum-core"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# `ensure_crypto_provider` for signing test tokens, and `test_session` for the
# claim-lock test; both are what the library tests use.
axess-core = { path = "../../axess-core", version = "=0.16.0", features = ["testing", "oauth"] }
axess-factors = { path = "../../axess-factors", version = "=0.16.0", features = ["jwt-rust-crypto"] }
# The tests stand up an OIDC provider in process and sign its tokens.
base64 = "0.23.1"
http-body-util = "0.1.5"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rsa = { version = "0.9.10", features = ["pkcs5"] }
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
wiremock = "0.6.5"
