[package]
name = "axess-example-oauth"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
publish = false
resolver = "3"
description = "OAuth 2.0 / OIDC login example for the Axess library."
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"

[dependencies]
axess = { path = "../../axess", features = ["oauth", "testing"] }
axum = { version = "0.8.9", features = ["json", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
