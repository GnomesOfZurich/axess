[package]
name = "axess-example-oauth"
version = "0.0.14"
edition = "2024"
publish = false
resolver = "3"
description = "OAuth 2.0 / OIDC login example for the Axess library."
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"

[dependencies]
axess = { path = "../../axess", features = ["oauth"] }
axum = { version = "0.8.8", features = ["json", "form"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
