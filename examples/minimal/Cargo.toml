# The example the getting-started chapter walks through.
#
# It exists so that chapter's code is compiled rather than asserted. The
# book pulls the body in with mdBook's `{{#include}}` and an ANCHOR, so
# the page cannot drift from something that builds: change the API and
# this crate stops compiling, which fails CI before the chapter is wrong.
[package]
name = "axess-example-minimal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
# `memory` for the in-process session store, `testing` for
# `InMemoryBackend`. Both are what let this run with no database.
# Demo built on the in-memory backend of `testing`: a debug demo, so a release build of it is refused by the guard.
axess = { path = "../../axess", version = "=0.20.0", features = ["memory", "testing"] }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# `test_session` gives the login handler's test a session without a router.
axess-core = { path = "../../axess-core", version = "=0.20.0", features = ["testing"] }
# `password::recording` reports the Argon2 parameters each refusal ran
# under, for the comparison of what a known and an unknown user cost.
axess-factors = { path = "../../axess-factors", version = "=0.20.0", features = ["testing"] }
