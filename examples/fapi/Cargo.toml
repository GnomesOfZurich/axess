[package]
name = "axess-example-fapi"
version = "0.19.0"
edition = "2024"
rust-version.workspace = true
publish = false
resolver = "3"
description = "FAPI 2.0 example for the Axess library: private_key_jwt, PAR, DPoP, form_post."
authors = ["Gnomes"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/GnomesOfZurich/axess"

[dependencies]
# Demo built on the mock stores and mock provider of `testing`: it opts out of the release-build guard by name.
axess = { path = "../../axess", version = "=0.19.0", features = ["oauth", "fapi", "jwt-rust-crypto", "testing", "allow-testing-in-release"] }
# `Algorithm` names the signing algorithm of the `private_key_jwt` key. No
# crypto backend here: `axess`'s `jwt-rust-crypto` feature picks the one
# provider, and a second one makes `jsonwebtoken` refuse to choose.
jsonwebtoken = { version = "11.1.0", default-features = false }
axum = { version = "0.8.9", features = ["json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
# Parses the issuer to judge its host: `is_local_issuer`.
url = "2.5.8"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# Drives the router in process: `ServiceExt::oneshot`.
tower = { version = "0.5.3", features = ["util"] }
