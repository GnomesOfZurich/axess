services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: axess-fapi-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: "localhost"
    ports:
      - "8080:8080"
    volumes:
      - ./fapi-realm.json:/opt/keycloak/data/import/fapi-realm.json:Z
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test:
        - CMD-SHELL
        - exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
