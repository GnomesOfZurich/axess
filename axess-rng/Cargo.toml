[package]
name = "axess-rng"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axess-rng"
readme = "README.md"
description = """
Injectable cryptographically-secure RNG trait for deterministic simulation
testing (DST). Production code depends on the `SecureRng` trait; tests inject
`MockRng` (a seeded PRNG) for reproducible randomness in auth flows, token
issuance, and key generation.
"""
keywords = ["rng", "random", "simulation", "deterministic", "testing"]
categories = ["cryptography", "development-tools::testing"]
exclude = ["tests/", "benches/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Always-on test fixtures (`MockRng`) live under [`testing`]. Adopters
# enabling this feature get the seeded PRNG in their dev-deps without
# forcing every production consumer of the trait to compile it.
testing = []
# Number-oriented reproducible RNG surface (`NumericRng` trait +
# `Xoshiro256pp`) for Monte Carlo, statistical sampling, and DST.
# Opt-in so downstream consumers that only need the byte-oriented
# cryptographic surface (`SecureRng`) don't pay for the numeric code
# path. Enables `MockNumericRng` under `testing`.
numeric = []

[dependencies]
rand = { workspace = true, features = ["std"] }
