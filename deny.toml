# cargo-deny configuration: CRA supply chain policy
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check licenses sources bans
# CI:  cargo deny check licenses sources bans
#
# `cargo deny check advisories` currently fails on cargo-deny 0.18.x because
# the upstream RustSec advisory database contains CVSS 4.0 entries that the
# crate's parser does not yet accept (parse error on libcrux-poly1305 et al.,
# even though those crates are not in our dependency tree). Re-enable the
# `advisories` check once cargo-deny ships CVSS 4.0 support.

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
ignore = [
    # rsa: Marvin Attack timing sidechannel (RUSTSEC-2023-0071)
    # Severity: 5.9 (medium). No fixed version available.
    #
    # Reachability, stated precisely because an earlier version of this note
    # called it transitive-only and that was wrong:
    #   - Transitively, via sqlx-mysql and openidconnect (rsa 0.9), and via
    #     crypto-glue (webauthn-rs), which carries the 0.10.0-rc line.
    #   - Directly, as an optional runtime dependency of axess-core enabled by
    #     `local-idp`, for RSA-2048 keygen and PKCS#1 parsing in
    #     `LocalIdpSigningKey`.
    #   - Directly, under `jwt-rust-crypto`, because jsonwebtoken's
    #     `rust_crypto` backend performs RS256 signing and verification
    #     through this crate.
    #
    # Risk: the advisory is a timing sidechannel on RSA private-key
    # operations. RSA is not used for session encryption or key exchange, and
    # keygen is unaffected. The exposed operation is RS256 *signing*, which
    # only happens when `local-idp` is enabled (off by default) and the
    # deployment mints its own tokens. A deployment that signs with
    # `local-idp` over an attacker-reachable interface should prefer ES256, or
    # the `jwt-aws-lc` backend, which does not route through this crate.
    # Verification-only deployments are not exposed.
    #
    # Resolution: wait for rsa crate maintainers to release a fix.
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.5: timing variability in operations meant to be
    # constant-time (RUSTSEC-2026-0387). Patched only in 0.7.6.
    #
    # Reachability: through p256 0.13 (local-idp keygen and PKCS#8 encoding,
    # the FAPI client's key loading, ES256 signing and verification under
    # `jwt-rust-crypto`), which axess-core and axess-factors depend on
    # directly, and which jsonwebtoken 11.1 pins itself. openidconnect 4.1.0
    # and crypto-glue 0.2 (webauthn-rs 0.6.2) are on p256 0.14 and
    # crypto-bigint 0.7, so they no longer reach 0.5.5.
    #
    # Risk, read against the 0.5.5 source on 2026-10-24: the advisory's named
    # defects (`UintRef` equality exiting early, `BoxedMontyForm::invert`
    # branching, and the 0.7 subtraction, zero-count, division and Montgomery
    # code) are 0.7-series code that 0.5.5 does not contain. What p256 0.13
    # uses from 0.5.5 is byte decoding, `ct_eq` (XOR-accumulated over every
    # limb), `conditional_select` and `sbb` (wide-word arithmetic, no
    # data-dependent branch); its field arithmetic is p256's own. The residue
    # is the generic risk that a compiler introduces a branch into Rust
    # written branch-free, which every pure-Rust curve shares. A deployment
    # that signs ES256 over an attacker-reachable interface can take the
    # `jwt-aws-lc` backend, which does not route through this crate.
    #
    # Resolution: remove when jsonwebtoken moves to p256 0.14 (elliptic-curve
    # 0.14, crypto-bigint 0.7) and axess's own p256 pin follows.
    "RUSTSEC-2026-0387",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Examples depend on workspace members via path = "..." without a version
# (they are `publish = false` and never resolved from a registry). Allow
# wildcards on path entries only; published crates still need a version pin.
allow-wildcard-paths = true

# Known-accepted transitive duplicate roots. Each entry documents why the
# upstream cannot yet consolidate; see the workspace-preamble comment on
# `[workspace.dependencies]` in Cargo.toml for the wider policy. Revisit
# annually when upstream release cadence catches up.
#
# `skip-tree` matches any duplicate whose dependency path traces through
# the named root, so one entry covers the whole RustCrypto cohort under a
# git-pinned crate rather than 15+ individual `skip` lines.
skip-tree = [
    # `webauthn-rs v0.6.2` reaches, through `crypto-glue` 0.2, the
    # elliptic-curve 0.14 cohort (p256 / p384 0.14, ecdsa 0.17, crypto-bigint
    # 0.7, der 0.8, pkcs8 0.11, spki 0.8, sec1 0.8, signature 3) and a
    # pre-release `rsa 0.10.0-rc`, while axess itself and jsonwebtoken stay on
    # p256 0.13 and rsa 0.9; `argon2 0.5` (with password-hash 0.5 and
    # blake2 0.10) beside the argon2 0.6 axess uses; and scrypt 0.12,
    # pbkdf2 0.13 and salsa20 0.11 beside the older lines other crates
    # carry. Its hash and cipher crates are the digest 0.11 cohort axess
    # uses, so those no longer duplicate.
    { crate = "webauthn-rs@0.6.2", reason = "crypto-glue 0.2 is on elliptic-curve 0.14, rsa 0.10.0-rc and argon2 0.5 beside axess's p256 0.13, rsa 0.9 and argon2 0.6" },

    # `getrandom 0.3.4` fans a WASI stdlib shim (`wasip2 → wit-bindgen
    # 0.57`) plus `r-efi 5` for UEFI targets, beside the `r-efi 6` of
    # getrandom 0.4.3 (which needs no entry of its own). None of these are
    # linked in a non-WASI / non-UEFI axess build.
    { crate = "getrandom@0.3.4", reason = "wasi/uefi shim tree (wit-bindgen, r-efi); not linked in axess targets" },

    # `openidconnect 4.1.0` + `oauth2 5.0.0` still on rand 0.8 / rand_core
    # 0.6, hmac 0.12 / sha2 0.10, base64 0.22 and thiserror 1; axess itself
    # is on rand 0.10 / rand_core 0.10, the digest 0.11 cohort, base64 0.23
    # and thiserror 2.
    # It is also a release ahead of jsonwebtoken 11.1 on ed25519-dalek (3
    # against 2, with curve25519-dalek 5 against 4).
    { crate = "openidconnect@4.1.0", reason = "still on rand 0.8, hmac 0.12 / sha2 0.10, base64 0.22 and thiserror 1; ahead of jsonwebtoken on ed25519-dalek 3" },

    # `sqlx 0.9` pulls its own copies of hashbrown, thiserror, itertools,
    # socket2, windows-sys at older majors from the database-driver
    # ecosystem. Not adopter-controllable.
    { crate = "sqlx@0.9.0", reason = "database-driver ecosystem carries its own hashbrown/thiserror/socket2/windows-sys majors" },

    # `rcgen 0.14.10` is a dev-dependency: test certificates for the mTLS
    # and x509 paths, and moved to `pem 4`, while `jsonwebtoken 11` is
    # still on `pem 3`. The two only ever coexist in a dev/test build;
    # rcgen never reaches an adopter's tree.
    { crate = "rcgen@0.14.10", reason = "dev-only test-certificate crate; on pem 4 while jsonwebtoken 11 is on pem 3" },

    # `cedar-policy-core` transitively pulls `lalrpop` for grammar
    # generation; lalrpop 0.22 carries older unicode-width / hashbrown
    # majors that don't reach runtime.
    { crate = "cedar-policy-core@4.14.1", reason = "lalrpop build-time transitives carry older unicode-width/hashbrown/itertools" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
