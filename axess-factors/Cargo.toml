[package]
name = "axess-factors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/axess-factors"
readme = "README.md"
resolver = "3"
description = "Authentication factor implementations for axess: Argon2id passwords, TOTP (RFC 6238), HOTP (RFC 4226), FIDO2, LDAP, mTLS, OAuth/OIDC, JWT, bearer."
keywords = ["authentication", "password", "totp", "hotp", "mfa"]
categories = ["authentication", "cryptography"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Workspace internal
axess-clock = { workspace = true, optional = true }
axess-identity = { workspace = true, optional = true }
axess-rng = { workspace = true, optional = true }

# External
axum = { workspace = true, default-features = false, features = ["original-uri", "form", "json", "query"], optional = true }
base32 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
dashmap = { version = "6.2.1", features = ["serde"], optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
# `aws_lc_rs` keeps one TLS provider across the workspace.
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"], optional = true }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"], optional = true }
# `timing-resistant-secret-traits` makes secret types refuse `PartialEq` / `Hash`.
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"], optional = true }
p256 = { version = "0.13.2", features = ["ecdsa", "jwk"], optional = true }
# Pinned exact: `password-auth`'s defaults set the Argon2id work factors
# (m, t, p). Floating to `^1.0.0` would silently change those parameters
# on a minor bump and break hash stability.
password-auth = { version = "1.0.0", optional = true }
# 0.12 to match axess-core's pin; avoids a duplicate-major in the resolved tree
# (openidconnect 4.0.1 -> oauth2 5.0.0 transitively pins reqwest = "0.12").
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"], optional = true }
rustls-pki-types = { version = "1.15.0", optional = true }
# `rc` is required by `EmailOtpConfig::email: Arc<str>` (Deserialize for
# `Arc<str>` is not implemented without it).
serde = { version = "1.0.229", features = ["derive", "rc"] }
# `std` re-enabled: workspace pin disables defaults for `alloc`-only embedded.
serde_json = { workspace = true, features = ["std"] }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "macros"], optional = true }
totp-rs = { version = "5.7.2", features = ["gen_secret", "serde_support", "zeroize"], optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
webauthn-rs = { version = "0.6.0-dev", features = ["danger-allow-state-serialisation", "conditional-ui"], optional = true }
x509-parser = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
# Foundation crates' `testing` features are gated; enabling here makes
# `axess_rng::testing::MockRng` / `axess_identity::testing::*` visible
# during `cargo test` without forcing production consumers to compile them.
axess-clock = { workspace = true, features = ["testing"] }
axess-identity = { workspace = true, features = ["testing"] }
axess-rng = { workspace = true, features = ["testing"] }
# rcgen mints SPIFFE-shape X509-SVID certs for mTLS resolver tests.
rcgen = "0.14.8"
rsa = { version = "0.9.10", features = ["pkcs5"] }
wiremock = "0.6.5"

[features]
default = ["password", "totp", "hotp", "email_otp"]

# Symmetric credential factors
email_otp = ["dep:chrono"]
hotp = ["dep:hmac", "dep:sha1", "dep:sha2", "dep:base32", "dep:hex", "dep:subtle"]
password = ["dep:password-auth"]
# `totp` lists `base32`/`hex` explicitly even though they overlap with `hotp`;
# without that, totp-only builds fail to compile until `hotp` is also enabled.
totp = ["dep:totp-rs", "dep:axess-rng", "dep:subtle", "dep:base32", "dep:hex"]

# Asymmetric / transport-bound factors
fido2 = ["dep:webauthn-rs", "dep:url", "dep:chrono", "dep:axess-identity", "dep:uuid"]
ldap = ["dep:ldap3", "dep:subtle", "dep:tokio", "dep:thiserror"]
mtls = ["dep:axess-identity", "dep:rustls-pki-types", "dep:x509-parser", "dep:thiserror"]

# JWT / OIDC primitives (consumed by federation adapters, bearer, oauth)
jwt = ["dep:jsonwebtoken", "dep:axess-clock", "dep:base64", "dep:axess-identity", "dep:tokio", "dep:thiserror"]
oidc = ["dep:jsonwebtoken", "dep:openidconnect", "dep:tokio", "dep:thiserror", "dep:base64"]

# OAuth ceremony surface
fapi = ["oauth", "dep:p256"]
oauth = ["oidc", "jwt", "dep:url", "dep:uuid", "dep:axum", "dep:dashmap", "dep:axess-identity"]

# Bearer + outbound + federation adapters (all sit on `jwt`)
bearer = ["jwt", "dep:axum", "dep:tower", "dep:thiserror"]
# Plain-OAuth-2.0 user login ("social login") for providers that do
# not support OIDC (GitHub user login, Twitter/X, Discord, Reddit,
# Spotify, …). OFF BY DEFAULT: the security model is weaker than
# OIDC (no signed identity assertion; identity comes from a
# TLS-trusted userinfo HTTPS GET). See `src/social.rs` module docs
# for the full delta and when to reach for this vs OIDC.
social = ["dep:reqwest", "dep:sha2", "dep:base64", "dep:thiserror", "dep:axess-rng", "dep:tokio"]
# SPIFFE JWT-SVID: kept separate because it implements the SPIFFE
# *spec* (mandatory `spiffe://` URI in `sub`, trust-domain extracted
# from the URI), not just a claim shape. The generic `WorkloadResolver`
# under `jwt` covers every other JWT-bearer workload-identity flow
# (GitHub Actions, k8s SA, GitLab CI, Okta, Azure AD, Auth0, …) via
# an adopter-supplied claim parser plus mapping closure; see the
# `axess-example-workload-identity` crate for ready-made recipes.
jwt-svid = ["jwt"]
outbound-oauth = ["jwt", "dep:reqwest", "dep:tokio", "dep:url", "dep:uuid", "dep:axess-clock", "dep:axess-rng", "dep:chrono", "dep:base64", "dep:thiserror"]

# Umbrella over the full federation surface
federation = ["jwt", "jwt-svid", "oauth", "bearer", "outbound-oauth"]
