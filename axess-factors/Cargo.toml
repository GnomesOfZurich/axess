[package]
name = "axess-factors"
version = "0.0.6"
publish = false
edition = "2024"
resolver = "3"
description = "Authentication factor implementations for Axess authentication."
authors = ["Gnomes <info@gnomes.ch>"]
license = "MIT"
repository = "https://github.com/GnomesOfZurich/axess"

[dependencies]
password-auth = { version = "1.0.0", optional = true }
totp-rs = { version = "5.7.0", features = [
  "gen_secret",
  "serde_support",
  "zeroize",
], optional = true}
base32 = { version = "0.5.1", optional = true }
hex = { version = "0.4.3", optional = true }
zeroize = { version = "1.5.7", optional = true }
subtle = { version = "2.4.1", optional = true }
libreauth = { version = "0.18.1", optional = true }

[features]
password = ["dep:password-auth"]
totp = ["dep:totp-rs"]
hotp = ["dep:libreauth", "dep:base32", "dep:hex", "dep:zeroize", "dep:subtle"]
default = ["password", "totp", "hotp"]
