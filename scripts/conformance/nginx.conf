# Plain-http front for the suite. The suite refuses any request whose scheme
# is not https, so the proxy says so in X-Forwarded-Proto; the origin the
# suite advertises (BASE_URL) stays the http loopback one.
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    server {
        listen 8080;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;
        location / {
            proxy_pass http://server:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port 9080;
        }
    }
}
